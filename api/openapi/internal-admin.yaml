openapi: 3.1.0
info:
  title: Aera Cloud Internal Admin API
  version: 1.2.0
  description: |
    Shared provider/consumer contract for the Aera Cloud Internal Admin API.
    Exact identity lookup accepts a full email or phone only in the request body;
    every identity field in every response remains masked.
    Official Agent routes additionally require signed admin_id/admin_role claims.
    Official Quality routes expose only k-anonymous aggregates and human governance
    records; they never expose raw events, rotating pseudonyms, or user runtime data.
    Mutations bind operation_id to Idempotency-Key; rollback also binds a distinct
    requester_admin_id and approval_id. GET operations/{operationID} is the only
    ambiguous-result reconciliation endpoint.
servers:
  - url: https://aera-cloud-admin.invalid
security:
  - mutualTLS: []
    serviceJWT: []
paths:
  /internal/admin/v1/health:
    get:
      operationId: getCloudAdminHealth
      responses:
        '200':
          description: Internal Admin API is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /internal/admin/v1/users:
    get:
      operationId: listCloudUsers
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200':
          description: Masked Cloud user page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
  /internal/admin/v1/users/lookup:
    post:
      operationId: lookupCloudUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LookupRequest' }
      responses:
        '200':
          description: One masked Cloud user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /internal/admin/v1/users/{userID}:
    get:
      operationId: getCloudUser
      parameters: [{ $ref: '#/components/parameters/UserID' }]
      responses:
        '200':
          description: One masked Cloud user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /internal/admin/v1/users/{userID}/devices:
    get:
      operationId: listCloudUserDevices
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Device page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
  /internal/admin/v1/users/{userID}/sessions:
    get:
      operationId: listCloudUserSessions
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
  /internal/admin/v1/devices/{deviceID}/revoke:
    post:
      operationId: revokeCloudDevice
      parameters:
        - { $ref: '#/components/parameters/DeviceID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: { '200': { $ref: '#/components/responses/Operation' } }
  /internal/admin/v1/sessions/{sessionID}/revoke:
    post:
      operationId: revokeCloudSession
      parameters:
        - { $ref: '#/components/parameters/SessionID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: { '200': { $ref: '#/components/responses/Operation' } }
  /internal/admin/v1/users/{userID}/disable:
    post:
      operationId: disableCloudUser
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: { '200': { $ref: '#/components/responses/Operation' } }
  /internal/admin/v1/users/{userID}/enable:
    post:
      operationId: enableCloudUser
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/Command' }
      responses: { '200': { $ref: '#/components/responses/Operation' } }
  /internal/admin/v1/operations/{operationID}:
    get:
      operationId: getCloudAdminOperation
      parameters: [{ $ref: '#/components/parameters/OperationID' }]
      responses: { '200': { $ref: '#/components/responses/Operation' } }
  /internal/admin/v1/official-agent-definitions:
    get:
      operationId: listOfficialAgentDefinitions
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialDefinitionPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: reserveOfficialAgentDefinition
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialDefinitionMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/PublicationDLPBlocked' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-definitions/{definitionID}:
    get:
      operationId: getOfficialAgentDefinition
      parameters: [{ $ref: '#/components/parameters/DefinitionID' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialDefinition' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-drafts:
    get:
      operationId: listOfficialAgentDrafts
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialDraftPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createOfficialAgentDraft
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialDraftCreateMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/PublicationDLPBlocked' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-drafts/{draftID}:
    get:
      operationId: getOfficialAgentDraft
      parameters: [{ $ref: '#/components/parameters/DraftID' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialDraft' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateOfficialAgentDraft
      parameters: [{ $ref: '#/components/parameters/DraftID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialDraftUpdateMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/PublicationDLPBlocked' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-drafts/{draftID}/validate:
    post:
      operationId: validateOfficialAgentDraft
      parameters: [{ $ref: '#/components/parameters/DraftID' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialDraftValidation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-drafts/{draftID}/submissions:
    post:
      operationId: submitOfficialAgentDraft
      parameters: [{ $ref: '#/components/parameters/DraftID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialDeveloperEmptyMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/PublicationDLPBlocked' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-submissions:
    get:
      operationId: listOfficialAgentSubmissions
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { enum: [pending, approved, rejected, withdrawn, superseded] }
      responses:
        '200': { $ref: '#/components/responses/OfficialSubmissionPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-submissions/{submissionID}:
    get:
      operationId: getOfficialAgentSubmission
      parameters: [{ $ref: '#/components/parameters/SubmissionID' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialSubmission' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-submissions/{submissionID}/withdraw:
    post:
      operationId: withdrawOfficialAgentSubmission
      parameters: [{ $ref: '#/components/parameters/SubmissionID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialDeveloperEmptyMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-submissions/{submissionID}/reviews:
    post:
      operationId: reviewOfficialAgentSubmission
      parameters: [{ $ref: '#/components/parameters/SubmissionID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialReviewMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/PublicationDLPBlocked' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-versions:
    get:
      operationId: listOfficialAgentVersions
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialVersionPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-versions/{versionID}:
    get:
      operationId: getOfficialAgentVersion
      parameters: [{ $ref: '#/components/parameters/VersionID' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialVersion' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-releases:
    get:
      operationId: listOfficialAgentReleases
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialReleasePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-releases/{releaseID}:
    get:
      operationId: getOfficialAgentRelease
      parameters: [{ $ref: '#/components/parameters/ReleaseID' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialRelease' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-releases/{releaseID}/activate:
    post:
      operationId: activateOfficialAgentRelease
      parameters: [{ $ref: '#/components/parameters/ReleaseID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialActivateMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-releases/{releaseID}/rollout:
    post:
      operationId: updateOfficialAgentRollout
      parameters: [{ $ref: '#/components/parameters/ReleaseID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialRolloutMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-releases/{releaseID}/pause:
    post:
      operationId: pauseOfficialAgentRelease
      parameters: [{ $ref: '#/components/parameters/ReleaseID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialOperatorEmptyMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-releases/{releaseID}/resume:
    post:
      operationId: resumeOfficialAgentRelease
      parameters: [{ $ref: '#/components/parameters/ReleaseID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialOperatorEmptyMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-releases/{releaseID}/rollback:
    post:
      operationId: rollbackOfficialAgentRelease
      description: Requires a distinct signed requester_admin_id and approval_id.
      parameters: [{ $ref: '#/components/parameters/ReleaseID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialRollbackMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/OfficialAgentNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-agent-audit-events:
    get:
      operationId: listOfficialAgentAuditEvents
      description: Complete safe history; available only to Super Admin and Auditor actors.
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialAuditPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-quality/aggregates:
    get:
      operationId: listOfficialQualityAggregates
      description: Returns only unsuppressed buckets with at least ten distinct rotating subjects. No raw-event or identity drill-down exists.
      x-required-service-scope: official_quality:read
      parameters:
        - name: platform_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: definition_id
          in: query
          schema: { type: string, format: uuid }
        - name: from_day
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to_day
          in: query
          required: true
          schema: { type: string, format: date }
        - { $ref: '#/components/parameters/QualityCursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/OfficialQualityAggregatePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-quality/proposals:
    get:
      operationId: listOfficialQualityProposals
      x-required-service-scope: official_quality:read
      parameters:
        - name: platform_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { enum: [open, submitted, approved, rejected, draft_linked, closed] }
        - { $ref: '#/components/parameters/ProposalCursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/OfficialQualityProposalPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createOfficialQualityProposal
      description: Developer-only human proposal creation from exact visible aggregate identifiers. No Agent content is generated.
      x-required-service-scope: official_quality:propose
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialQualityProposalCreateMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '422': { $ref: '#/components/responses/PrivacyRejected' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-quality/proposals/{proposalID}:
    get:
      operationId: getOfficialQualityProposal
      x-required-service-scope: official_quality:read
      parameters: [{ $ref: '#/components/parameters/ProposalID' }]
      responses:
        '200': { $ref: '#/components/responses/OfficialQualityProposal' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/QualityProposalNotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-quality/proposals/{proposalID}/submit:
    post:
      operationId: submitOfficialQualityProposal
      x-required-service-scope: official_quality:propose
      parameters: [{ $ref: '#/components/parameters/ProposalID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialQualityProposalSubmitMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/QualityProposalNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-quality/proposals/{proposalID}/reviews:
    post:
      operationId: reviewOfficialQualityProposal
      description: A different Super Admin approves or rejects. Approval never creates a draft or publishes a version.
      x-required-service-scope: official_quality:review
      parameters: [{ $ref: '#/components/parameters/ProposalID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialQualityProposalReviewMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/QualityProposalNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /internal/admin/v1/official-quality/proposals/{proposalID}/clone:
    post:
      operationId: cloneOfficialQualityProposalToDraft
      description: Developer-only explicit clone of the verified immutable base into the normal editable platform draft. Aggregate values and proposal text are not copied into Agent content.
      x-required-service-scope: official_quality:clone
      parameters: [{ $ref: '#/components/parameters/ProposalID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/OfficialQualityProposalCloneMutation' }
      responses:
        '200': { $ref: '#/components/responses/Operation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/QualityProposalNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    mutualTLS: { type: mutualTLS }
    serviceJWT: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    UserID: { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceID: { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }
    SessionID: { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    OperationID: { name: operationID, in: path, required: true, schema: { type: string, format: uuid } }
    DefinitionID: { name: definitionID, in: path, required: true, schema: { type: string, format: uuid } }
    DraftID: { name: draftID, in: path, required: true, schema: { type: string, format: uuid } }
    SubmissionID: { name: submissionID, in: path, required: true, schema: { type: string, format: uuid } }
    VersionID: { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
    ReleaseID: { name: releaseID, in: path, required: true, schema: { type: string, format: uuid } }
    ProposalID: { name: proposalID, in: path, required: true, schema: { type: string, format: uuid } }
    QualityCursor: { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' } }
    ProposalCursor: { name: cursor, in: query, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    Command:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Command' }
    OfficialDefinitionMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDefinitionMutation' } } }
    OfficialDraftCreateMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDraftCreateMutation' } } }
    OfficialDraftUpdateMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDraftUpdateMutation' } } }
    OfficialDeveloperEmptyMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDeveloperEmptyMutation' } } }
    OfficialOperatorEmptyMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialOperatorEmptyMutation' } } }
    OfficialReviewMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialReviewMutation' } } }
    OfficialActivateMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialActivateMutation' } } }
    OfficialRolloutMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialRolloutMutation' } } }
    OfficialRollbackMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialRollbackMutation' } } }
    OfficialQualityProposalCreateMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialQualityProposalCreateMutation' } } }
    OfficialQualityProposalSubmitMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialQualityProposalSubmitMutation' } } }
    OfficialQualityProposalReviewMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialQualityProposalReviewMutation' } } }
    OfficialQualityProposalCloneMutation:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialQualityProposalCloneMutation' } } }
  responses:
    Operation:
      description: Idempotent operation state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Operation' }
    OfficialDefinition:
      description: Safe official Agent definition
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDefinition' } } }
    OfficialDefinitionPage:
      description: Official Agent definition page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDefinitionPage' } } }
    OfficialDraft:
      description: Official Agent draft
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDraft' } } }
    OfficialDraftPage:
      description: Official Agent draft page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDraftPage' } } }
    OfficialDraftValidation:
      description: Deterministic DLP and canonicalization result
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialDraftValidation' } } }
    OfficialSubmission:
      description: Immutable review submission state
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialSubmission' } } }
    OfficialSubmissionPage:
      description: Official Agent submission page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialSubmissionPage' } } }
    OfficialVersion:
      description: Published immutable official Agent version without signing material
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialVersion' } } }
    OfficialVersionPage:
      description: Official Agent version page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialVersionPage' } } }
    OfficialRelease:
      description: Current release revision with allowlist count only
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialRelease' } } }
    OfficialReleasePage:
      description: Official Agent release page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialReleasePage' } } }
    OfficialAuditPage:
      description: Rebuilt safe official Agent audit page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialAuditPage' } } }
    OfficialQualityAggregatePage:
      description: K-anonymous official Agent quality aggregate page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialQualityAggregatePage' } } }
    OfficialQualityProposal:
      description: Human-authored official quality governance proposal
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialQualityProposal' } } }
    OfficialQualityProposalPage:
      description: Official quality proposal page
      content: { application/json: { schema: { $ref: '#/components/schemas/OfficialQualityProposalPage' } } }
    InvalidRequest:
      description: Strict request validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    AuthenticationRequired:
      description: mTLS or actor-bound service JWT authentication failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PermissionDenied:
      description: The signed employee role or action scope is not authorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    OfficialAgentNotFound:
      description: The requested official Agent control-plane record does not exist
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    StateConflict:
      description: Expected revision or idempotency evidence conflicts with durable state; reconcile through GET operations/{operationID}
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PublicationDLPBlocked:
      description: Publication content failed the frozen DLP contract
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PrivacyRejected:
      description: The human-authored improvement objective failed the bounded privacy scan
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    QualityProposalNotFound:
      description: The official quality proposal is absent from the configured platform boundary
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Cloud could not prove a safe result; callers must remain unavailable or reconcile by operation ID
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties: { status: { const: ok } }
    LookupRequest:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { enum: [email, phone] }
        value: { type: string, minLength: 3, maxLength: 320 }
    UserStatus: { enum: [active, pending_deletion, disabled] }
    User:
      type: object
      additionalProperties: false
      required:
        - user_id
        - status
        - administratively_disabled
        - administrative_revision
        - device_count
        - active_device_count
        - active_session_count
        - created_at
      properties:
        user_id: { type: string, format: uuid }
        masked_email: { type: string, pattern: '^[^@* ]\*{3}@[A-Za-z0-9.-]+$' }
        masked_phone: { type: string, pattern: '^[0-9]{3}\*{4}[0-9]{4}$' }
        status: { $ref: '#/components/schemas/UserStatus' }
        administratively_disabled: { type: boolean }
        deletion_finalized_at: { type: string, format: date-time }
        administrative_revision: { type: integer, minimum: 1 }
        device_count: { type: integer, minimum: 0 }
        active_device_count: { type: integer, minimum: 0 }
        active_session_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        last_cloud_activity_at: { type: string, format: date-time }
    UserPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        next_cursor: { type: string, maxLength: 512 }
    DevicePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Device' } }
        next_cursor: { type: string, maxLength: 512 }
    SessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        next_cursor: { type: string, maxLength: 512 }
    Device:
      type: object
      additionalProperties: false
      required: [device_id, user_id, display_name, platform, client_version, status]
      properties:
        device_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        platform: { type: string, minLength: 1, maxLength: 32 }
        client_version: { type: string, minLength: 1, maxLength: 64 }
        status: { enum: [active, inactive, revoked] }
        last_seen_at: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [session_id, user_id, device_id, status, issued_at, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        status: { enum: [active, rotated, expired, revoked, replay_detected] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    Command:
      type: object
      additionalProperties: false
      required: [operation_id, actor_admin_id, request_id, reason_code, expected_revision]
      properties:
        operation_id: { type: string, format: uuid }
        actor_admin_id: { type: string, format: uuid }
        approval_id: { type: string, format: uuid }
        request_id: { type: string, minLength: 1, maxLength: 128 }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, minLength: 1, maxLength: 128 }
        note: { type: string, minLength: 1, maxLength: 500 }
        expected_revision: { type: integer, minimum: 1 }
    OfficialMutationEvidence:
      type: object
      required: [operation_id, actor_admin_id, actor_admin_role, expected_revision, reason_code]
      properties:
        operation_id: { type: string, format: uuid }
        actor_admin_id: { type: string, format: uuid }
        actor_admin_role: { enum: [super_admin, developer, operator, support, finance, auditor] }
        approval_id: { type: string, format: uuid }
        requester_admin_id: { type: string, format: uuid }
        expected_revision: { type: integer, minimum: 1 }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, minLength: 1, maxLength: 128 }
    OfficialDefinitionMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, expected_revision, payload]
          properties:
            actor_admin_role: { const: developer }
            expected_revision: { const: 1 }
            payload:
              type: object
              additionalProperties: false
              required: [display_name]
              dependentRequired:
                icon_media_type: [icon_data]
                icon_data: [icon_media_type]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
                icon_media_type: { enum: [image/png, image/webp] }
                icon_data: { type: string, format: byte, maxLength: 699052 }
      unevaluatedProperties: false
    OfficialDraftCreatePayload:
      type: object
      additionalProperties: false
      required: [definition_id, kind, display_name, manifest, bundle]
      dependentRequired:
        icon_media_type: [icon_data]
        icon_data: [icon_media_type]
      properties:
        definition_id: { type: string, format: uuid }
        base_version_id: { type: string, format: uuid }
        kind: { enum: [initial, next] }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        icon_media_type: { enum: [image/png, image/webp] }
        icon_data: { type: string, format: byte, maxLength: 699052 }
        manifest: { $ref: '#/components/schemas/AgentManifestV1' }
        bundle: { $ref: '#/components/schemas/AgentVersionBundleV1' }
      oneOf:
        - properties: { kind: { const: initial } }
          not: { required: [base_version_id] }
        - properties: { kind: { const: next } }
          required: [base_version_id]
    OfficialDraftUpdatePayload:
      type: object
      additionalProperties: false
      required: [kind, display_name, manifest, bundle]
      dependentRequired:
        icon_media_type: [icon_data]
        icon_data: [icon_media_type]
      properties:
        base_version_id: { type: string, format: uuid }
        kind: { enum: [initial, next] }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        icon_media_type: { enum: [image/png, image/webp] }
        icon_data: { type: string, format: byte, maxLength: 699052 }
        manifest: { $ref: '#/components/schemas/AgentManifestV1' }
        bundle: { $ref: '#/components/schemas/AgentVersionBundleV1' }
      oneOf:
        - properties: { kind: { const: initial } }
          not: { required: [base_version_id] }
        - properties: { kind: { const: next } }
          required: [base_version_id]
    OfficialDraftCreateMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, expected_revision, payload]
          properties:
            actor_admin_role: { const: developer }
            expected_revision: { const: 1 }
            payload: { $ref: '#/components/schemas/OfficialDraftCreatePayload' }
      unevaluatedProperties: false
    OfficialDraftUpdateMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: developer }
            payload: { $ref: '#/components/schemas/OfficialDraftUpdatePayload' }
      unevaluatedProperties: false
    OfficialDeveloperEmptyMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: developer }
            payload: { type: object, additionalProperties: false }
      unevaluatedProperties: false
    OfficialOperatorEmptyMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: operator }
            payload: { type: object, additionalProperties: false }
      unevaluatedProperties: false
    OfficialReviewMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: super_admin }
            payload:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { enum: [approve, reject] }
                review_reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
                safe_note: { type: string, maxLength: 500 }
                initial_channels:
                  type: array
                  maxItems: 2
                  uniqueItems: true
                  items: { enum: [internal, stable] }
              oneOf:
                - required: [decision, initial_channels]
                  properties: { decision: { const: approve } }
                  not:
                    anyOf:
                      - { required: [review_reason_code] }
                      - { required: [safe_note] }
                - required: [decision, review_reason_code]
                  properties: { decision: { const: reject } }
                  not: { required: [initial_channels] }
      unevaluatedProperties: false
    OfficialActivateMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: operator }
            payload:
              type: object
              additionalProperties: false
              required: [version_id, rollout_basis_points, minimum_desktop_version]
              properties:
                version_id: { type: string, format: uuid }
                rollout_basis_points: { type: integer, minimum: 0, maximum: 10000 }
                minimum_desktop_version: { type: string, minLength: 5, maxLength: 64 }
                allowlisted_user_ids: { $ref: '#/components/schemas/OfficialAllowlist' }
      unevaluatedProperties: false
    OfficialRolloutMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: operator }
            payload:
              type: object
              additionalProperties: false
              required: [rollout_basis_points, minimum_desktop_version]
              properties:
                rollout_basis_points: { type: integer, minimum: 0, maximum: 10000 }
                minimum_desktop_version: { type: string, minLength: 5, maxLength: 64 }
                allowlisted_user_ids: { $ref: '#/components/schemas/OfficialAllowlist' }
      unevaluatedProperties: false
    OfficialRollbackMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialMutationEvidence' }
        - type: object
          required: [actor_admin_role, approval_id, requester_admin_id, payload]
          properties:
            actor_admin_role: { const: super_admin }
            payload:
              type: object
              additionalProperties: false
              required: [target_version_id, target_release_revision_id]
              properties:
                target_version_id: { type: string, format: uuid }
                target_release_revision_id: { type: string, format: uuid }
      unevaluatedProperties: false
    OfficialQualityMutationEvidence:
      type: object
      required: [operation_id, actor_admin_id, actor_admin_role, expected_revision, reason_code]
      properties:
        operation_id: { type: string, format: uuid }
        actor_admin_id: { type: string, format: uuid }
        actor_admin_role: { enum: [super_admin, developer] }
        expected_revision: { type: integer, minimum: 1 }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, minLength: 1, maxLength: 128 }
    OfficialQualityProposalCreateMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialQualityMutationEvidence' }
        - type: object
          required: [actor_admin_role, expected_revision, payload]
          properties:
            actor_admin_role: { const: developer }
            expected_revision: { const: 1 }
            payload:
              type: object
              additionalProperties: false
              required: [aggregate_ids, problem_categories, improvement_objective]
              properties:
                aggregate_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
                problem_categories:
                  type: array
                  minItems: 1
                  maxItems: 6
                  uniqueItems: true
                  items: { enum: [reliability, latency, tool_quality, correctness, safety, usability] }
                improvement_objective:
                  type: string
                  minLength: 20
                  maxLength: 2000
                  description: Human-authored, DLP-scanned internal objective; copied user content is forbidden.
      unevaluatedProperties: false
    OfficialQualityProposalSubmitMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialQualityMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: developer }
            payload: { type: object, additionalProperties: false }
      unevaluatedProperties: false
    OfficialQualityProposalReviewMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialQualityMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: super_admin }
            payload:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { enum: [approve, reject] }
      unevaluatedProperties: false
    OfficialQualityProposalCloneMutation:
      allOf:
        - { $ref: '#/components/schemas/OfficialQualityMutationEvidence' }
        - type: object
          required: [actor_admin_role, payload]
          properties:
            actor_admin_role: { const: developer }
            payload: { type: object, additionalProperties: false }
      unevaluatedProperties: false
    OfficialAllowlist:
      type: array
      maxItems: 10000
      uniqueItems: true
      items: { type: string, format: uuid }
    AgentManifestV1:
      type: object
      additionalProperties: false
      required: [schema_version, identity, assets, model_constraints, tools, dependencies, runtime_compatibility]
      properties:
        schema_version: { type: integer, enum: [1] }
        identity: { $ref: '#/components/schemas/AgentIdentityV1' }
        assets:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/AgentManifestAssetV1' }
        model_constraints: { $ref: '#/components/schemas/AgentModelConstraintsV1' }
        tools: { $ref: '#/components/schemas/AgentToolPolicyV1' }
        dependencies:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/AgentDependencyV1' }
        runtime_compatibility: { $ref: '#/components/schemas/AgentRuntimeCompatibilityV1' }
    AgentIdentityV1:
      type: object
      additionalProperties: false
      required: [system_prompt]
      properties:
        system_prompt: { type: string, minLength: 1, maxLength: 262144 }
    AgentManifestAssetV1:
      type: object
      additionalProperties: false
      required: [path, kind, media_type, sha256]
      properties:
        path: { type: string, minLength: 1, maxLength: 512 }
        kind: { enum: [skill, sop, knowledge] }
        media_type: { enum: [text/markdown, text/plain] }
        sha256: { $ref: '#/components/schemas/SHA256Digest' }
    AgentModelConstraintsV1:
      type: object
      additionalProperties: false
      required: [allowed_providers, allowed_models]
      properties:
        allowed_providers:
          type: array
          minItems: 1
          uniqueItems: true
