      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/WorkspaceInvitationID'
      responses:
        '204':
          description: Invitation revoked.
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
