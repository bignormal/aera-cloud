                $ref: '#/components/schemas/AgentInstallation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-installations/{installation_id}/select-version:
    post:
      operationId: selectUserAgentInstallationVersion
      description: The maximum Agent metadata request body is 65536 bytes. A newly selected version applies only to later Runtime bindings.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentInstallationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectAgentInstallationVersionRequest'
      responses:
        '200':
          description: Installation selected version and signed policy snapshot updated atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-installations/{installation_id}/archive:
    post:
      operationId: archiveUserAgentInstallation
      description: The maximum Agent metadata request body is 65536 bytes. Archive changes cloud control metadata only and does not delete a Hermes profile.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentInstallationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAgentInstallationRequest'
      responses:
        '200':
          description: Installation archived without deleting local runtime state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/runtime-binding-records:
    post:
      operationId: recordUserAgentRuntimeBinding
      description: The maximum Agent metadata request body is 65536 bytes. This records immutable control-plane identifiers and never uploads session, Memory, files, or credentials.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuntimeBindingRecordRequest'
      responses:
        '201':
          description: Runtime binding record persisted for a newly starting session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBindingRecord'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /.well-known/agentera-signing-keys.json:
    get:
      operationId: getAgentEraSigningKeys
      description: Returns current public keys for access, offline-entitlement, Agent version, Agent policy, and Organization policy verification.
      responses:
        '200':
          description: Public Ed25519 verification keys for every signed desktop control-plane artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeySet'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: agentera_browser_session
    desktopAccessToken:
      type: http
      scheme: bearer
      bearerFormat: AgentEra access JWT
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    OptionalCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when browserSession is used; omitted for desktopAccessToken.
      schema:
        type: string
        minLength: 43
        maxLength: 43
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque operation key. The same key may be replayed only with the exact same request.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[^\\s\\x00]+$'
    OrganizationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Actor-bound Organization operation key. Only its SHA-256 digest is persisted for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an Organization visible to the actor.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationUserID:
      name: user_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an Organization member.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationDepartmentID:
      name: department_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for a Department in the exact Organization.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an Organization invitation.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationPolicySnapshotID:
      name: policy_snapshot_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an immutable Organization policy snapshot.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ExpectedOrganizationMemberRevision:
      name: expected_revision
      in: query
      required: true
      description: Positive Membership revision used for optimistic concurrency.
      schema:
        type: integer
        format: int64
        minimum: 1
    OrganizationPageLimit:
      name: limit
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    OrganizationCursor:
      name: cursor
      in: query
      required: false
      description: Opaque raw-base64url typed keyset cursor; the decoded payload is limited to 512 bytes and cannot cross collections.
      schema:
        type: string
        minLength: 1
        maxLength: 684
        pattern: '^[A-Za-z0-9_-]+$'
    WorkspaceIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque Workspace operation key, bounded to 128 UTF-8 bytes. Only its SHA-256 digest is persisted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace visible to the actor.
      schema:
        type: string
        format: uuid
    WorkspaceUserID:
      name: user_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace member.
      schema:
        type: string
        format: uuid
    WorkspaceInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace invitation.
      schema:
        type: string
        format: uuid
    ExpectedWorkspaceRevision:
      name: expected_revision
      in: query
      required: true
      description: Positive member revision used for optimistic concurrency.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentDefinitionID:
      name: definition_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExperienceCandidateID:
      name: candidate_id
      in: path
      required: true
      description: Canonical immutable ExperienceCandidate UUID within the exact Workspace.
      schema:
        type: string
        format: uuid
    AgentVersionID:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentPolicySnapshotID:
      name: policy_snapshot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentInstallationID:
      name: installation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    IdentityKind:
      type: string
      enum: [email, phone]
    VerificationPurpose:
      type: string
      enum: [registration, password_reset, bind_identity, account_deletion, deletion_recovery]
    VerificationChallengeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        captcha_token:
          type: string
          maxLength: 4096
    VerificationCodeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose, code]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    VerificationReceipt:
      type: object
      additionalProperties: false
      required: [status, receipt, expires_at]
      properties:
        status:
          type: string
          enum: [verified]
        receipt:
          type: string
          maxLength: 8192
        expires_at:
          type: string
          format: date-time
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required: [kind, verification_receipt, password, terms_version, privacy_version]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        verification_receipt:
          type: string
          maxLength: 8192
        password:
          type: string
          minLength: 10
          maxLength: 128
        nickname:
          type: string
          maxLength: 80
        terms_version:
          type: string
          maxLength: 64
        privacy_version:
          type: string
          maxLength: 64
    Registration:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
    BrowserLoginRequest:
      type: object
      additionalProperties: false
      required: [identity, password]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    BrowserLoginResponse:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, csrf_token]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [verification_receipt, new_password]
      properties:
        verification_receipt:
          type: string
          maxLength: 8192
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountProfile:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, status, identity_kinds, owned_workspace_count]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        status:
          type: string
          enum: [active]
        identity_kinds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityKind'
        owned_workspace_count:
          type: integer
          minimum: 0
          description: Exact number of active and archived Workspaces owned by this account; membership alone is not counted.
    CurrentPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
    IdentityBindingRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    AccountDeletionRecoveryRequest:
      type: object
      additionalProperties: false
      required: [identity, password, verification_receipt]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Device'
    Device:
      type: object
      additionalProperties: false
      required: [device_id, display_name, platform, app_version, status, last_seen_at, current]
      properties:
        device_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [darwin, windows, linux]
        app_version:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active, inactive, revoked]
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    DeviceSelfRevokeRequest:
      type: object
      additionalProperties: false
      required: [device_id, installation_id, timestamp, nonce, signature]
      properties:
        device_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        timestamp:
          type: integer
          format: int64
        nonce:
          type: string
          description: 32 random bytes encoded as canonical unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{43}$'
        signature:
          type: string
          description: Ed25519 signature of the AgentEra self-revocation digest, encoded as canonical unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{86}$'
    WorkspaceRole:
      type: string
      enum: [owner, admin, member]
    WorkspaceStatus:
      type: string
      enum: [active, archived]
    WorkspaceMutationState:
      type: string
      enum: [writable, archived, owner_unavailable]
    WorkspaceInvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, status, revision, mutation_state, role, member_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          $ref: '#/components/schemas/WorkspaceStatus'
        revision:
          type: integer
          format: int64
          minimum: 1
        mutation_state:
          $ref: '#/components/schemas/WorkspaceMutationState'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        member_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
    WorkspaceMember:
      type: object
      additionalProperties: false
      required: [user_id, role, revision, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        revision:
          type: integer
          format: int64
          minimum: 1
        joined_at:
          type: string
          format: date-time
    WorkspaceInvitation:
      type: object
      additionalProperties: false
      required: [id, status, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WorkspaceInvitationStatus'
        created_by_user_id:
          type: string
          format: uuid
        accepted_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    WorkspaceInvitationCreation:
      type: object
      additionalProperties: false
      required: [id, status, created_at, expires_at, secret_replayable]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WorkspaceInvitationStatus'
        created_by_user_id:
          type: string
          format: uuid
        accepted_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        token:
          type: string
          description: Present only on the first successful 201 creation response and never on replay or list responses.
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        invite_url:
          type: string
          description: Present only with token on the first 201; the secret is carried in a URI fragment.
          pattern: '^agentera://workspace-invitation#[A-Za-z0-9_-]{43}$'
        secret_replayable:
          type: boolean
          enum: [false]
    WorkspaceInvitationAcceptance:
      type: object
      additionalProperties: false
      required: [workspace, member]
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceSummary'
        member:
          $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    WorkspaceMemberListResponse:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceInvitationListResponse:
      type: object
      additionalProperties: false
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceInvitation'
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
    RenameWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [display_name, expected_revision]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        expected_revision:
          type: integer
          format: int64
          minimum: 1
    WorkspaceRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
    ChangeWorkspaceMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role, expected_revision]
      properties:
        role:
          type: string
          enum: [admin, member]
        expected_revision:
          type: integer
          format: int64
          minimum: 1
    AcceptWorkspaceInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
    WorkspaceErrorCode:
      type: string
      enum:
        - invalid_request
        - session_revoked
        - workspace_forbidden
        - workspace_not_found
        - invitation_unavailable
        - workspace_conflict
        - workspace_archived
        - workspace_owner_unavailable
        - membership_conflict
        - workspace_limit_reached
        - member_limit_reached
        - invitation_limit_reached
        - idempotency_conflict
        - rate_limited
        - service_unavailable
    WorkspaceErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              $ref: '#/components/schemas/WorkspaceErrorCode'
            request_id:
              type: string
              minLength: 1
              maxLength: 128
    ExperienceCandidateAsset:
      type: object
      additionalProperties: false
      required: [path, media_type, content]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: Normalized candidate-relative path below skills/{skill_name}/.
        media_type:
          type: string
          enum: [text/markdown, text/plain]
        content:
          type: string
          maxLength: 262144
          description: UTF-8 text only; server byte limits remain authoritative.
    ExperienceCandidateBundle:
      type: object
      additionalProperties: false
      required: [schema_version, skill_name, assets]
      properties:
        schema_version:
          type: integer
          enum: [1]
        skill_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9](?:[a-z0-9_-]{0,98}[a-z0-9])?$'
        assets:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ExperienceCandidateAsset'
    SubmitExperienceCandidateRequest:
      type: object
      additionalProperties: false
      required: [source_version_id, bundle, content_digest]
      properties:
        source_version_id:
          type: string
          format: uuid
        bundle:
          $ref: '#/components/schemas/ExperienceCandidateBundle'
        content_digest:
          $ref: '#/components/schemas/SHA256Digest'
    ReviewExperienceCandidateRequest:
      type: object
      additionalProperties: false
      required: [decision]
      description: APPROVED accepts no reason or note. REJECTED requires a bounded lowercase reason code and permits one safe single-line note.
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        safe_note:
          type: string
          minLength: 1
          maxLength: 240
    ExperienceCandidateReview:
      type: object
      additionalProperties: false
      required: [id, reviewed_by_user_id, decision, reviewed_at]
      properties:
        id:
          type: string
