openapi: 3.1.0
info:
  title: AgentEra App Cloud API
  version: 0.1.0
  description: Account, browser session, and identity verification contract for AgentEra Studio.
servers:
  - url: https://accounts.agentera.example
paths:
  /api/v1/verification/challenges:
    post:
      operationId: createVerificationChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationChallengeRequest'
      responses:
        '202':
          description: Delivery accepted without disclosing account existence.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/verification/challenges/verify:
    post:
      operationId: verifyIdentityChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCodeRequest'
      responses:
        '200':
          description: Short-lived, single-use verification receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/register:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
      responses:
        '201':
          description: User and personal space created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/browser/login:
    post:
      operationId: browserLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserLoginRequest'
      responses:
        '200':
          description: Host-only browser session started.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly, SameSite=Lax browser session cookie; Secure outside loopback development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/browser/logout:
    post:
      operationId: browserLogout
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Browser session ended.
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/password/reset:
    post:
      operationId: resetAccountPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password replaced and every existing device session family revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/me:
    get:
      operationId: getAccountProfile
      security:
        - browserSession: []
      responses:
        '200':
          description: Account and identity-kind metadata without email or phone values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/identities/bind:
    post:
      operationId: bindAccountIdentity
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityBindingRequest'
      responses:
        '204':
          description: Verified secondary identity bound after password reauthentication.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/identities/{kind}:
    delete:
      operationId: removeAccountIdentity
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdentityKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: Secondary login identity removed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          description: The only remaining login identity cannot be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/password/change:
    post:
      operationId: changeAccountPassword
      security:
        - desktopAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; the calling product session is preserved and every other device is revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/deletion:
    post:
      operationId: requestAccountDeletion
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account entered pending deletion and all cloud sessions, devices, and offline entitlements were revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/deletion/recover:
    post:
      operationId: recoverAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRecoveryRequest'
      responses:
        '204':
          description: Pending deletion recovered within seven days; old device sessions stay revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '410':
          description: The seven-day recovery window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices:
    get:
      operationId: listDevices
      security:
        - browserSession: []
        - desktopAccessToken: []
      responses:
        '200':
          description: Redacted active-device list without installation IDs or public keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/{device_id}:
    delete:
      operationId: revokeDevice
      security:
        - browserSession: []
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OptionalCSRFToken'
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device and its cloud sessions and offline entitlements revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          description: Device is not owned by the account or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/current/logout:
    post:
      operationId: logoutCurrentDevice
      security:
        - desktopAccessToken: []
      responses:
        '204':
          description: Calling device and all of its product sessions revoked.
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/self-revoke:
    post:
      operationId: selfRevokeDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSelfRevokeRequest'
      responses:
        '204':
          description: Device revoked after Ed25519 proof, nonce, and timestamp validation.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Signed device target is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Self-revocation nonce was already consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/legal/current:
    get:
      operationId: getCurrentLegalDocuments
      responses:
        '200':
          description: Versions that must be accepted for a new registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentLegalDocuments'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /oauth/authorize:
    get:
      operationId: beginDesktopAuthorization
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            enum: [agentera-studio]
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
            pattern: '^http://127\.0\.0\.1:[1-9][0-9]{0,4}/agentera/oauth/callback$'
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 1024
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: device_public_key
          in: query
          required: true
          description: Raw Ed25519 public key encoded as unpadded base64url.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: device_name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [darwin, windows, linux]
        - name: app_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: prompt
          in: query
          required: false
          description: Forces explicit browser account authentication when switching desktop users.
          schema:
            type: string
            enum: [select_account]
      responses:
        '303':
          description: Sensitive request values were persisted and removed from the browser URL.
          headers:
            Location:
              required: true
              schema:
                type: string
                description: Approval page, or a forced login page whose internal next target is the approval page.
                pattern: '^/(authorize\?request_id=|login\?next=)'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/authorize/approve:
    post:
      operationId: approveDesktopAuthorization
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationApprovalRequest'
      responses:
        '200':
          description: Exact loopback callback URL containing a one-time code and the original state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationApprovalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/token:
    post:
      operationId: exchangeDesktopAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCodeExchangeRequest'
      responses:
        '200':
          description: Device-bound product session and a new seven-day offline entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: The code was replayed or the five-active-device limit was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/refresh:
    post:
      operationId: refreshDesktopSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated refresh token, short-lived access token, and renewed offline entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/revoke:
    post:
      operationId: revokeDesktopSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: The refresh-token family was revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /.well-known/agentera-signing-keys.json:
    get:
      operationId: getAgentEraSigningKeys
      responses:
        '200':
          description: Public Ed25519 access and offline-entitlement verification keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeySet'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: agentera_browser_session
    desktopAccessToken:
      type: http
      scheme: bearer
      bearerFormat: AgentEra access JWT
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    OptionalCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when browserSession is used; omitted for desktopAccessToken.
      schema:
        type: string
        minLength: 43
        maxLength: 43
  schemas:
    IdentityKind:
      type: string
      enum: [email, phone]
    VerificationPurpose:
      type: string
      enum: [registration, password_reset, bind_identity, account_deletion, deletion_recovery]
    VerificationChallengeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        captcha_token:
          type: string
          maxLength: 4096
    VerificationCodeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose, code]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    VerificationReceipt:
      type: object
      additionalProperties: false
      required: [status, receipt, expires_at]
      properties:
        status:
          const: verified
        receipt:
          type: string
          maxLength: 8192
        expires_at:
          type: string
          format: date-time
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required: [kind, verification_receipt, password, terms_version, privacy_version]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        verification_receipt:
          type: string
          maxLength: 8192
        password:
          type: string
          minLength: 10
          maxLength: 128
        nickname:
          type: string
          maxLength: 80
        terms_version:
          type: string
          maxLength: 64
        privacy_version:
          type: string
          maxLength: 64
    Registration:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
    BrowserLoginRequest:
      type: object
      additionalProperties: false
      required: [identity, password]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    BrowserLoginResponse:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, csrf_token]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [verification_receipt, new_password]
      properties:
        verification_receipt:
          type: string
          maxLength: 8192
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountProfile:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, status, identity_kinds]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        status:
          const: active
        identity_kinds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityKind'
    CurrentPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
    IdentityBindingRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    AccountDeletionRecoveryRequest:
      type: object
      additionalProperties: false
      required: [identity, password, verification_receipt]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Device'
    Device:
      type: object
      additionalProperties: false
      required: [device_id, display_name, platform, app_version, status, last_seen_at, current]
      properties:
        device_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [darwin, windows, linux]
        app_version:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active, inactive, revoked]
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    DeviceSelfRevokeRequest:
      type: object
      additionalProperties: false
      required: [device_id, installation_id, timestamp, nonce, signature]
      properties:
        device_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        timestamp:
          type: integer
          format: int64
        nonce:
          type: string
          description: 32 random bytes encoded as canonical unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{43}$'
        signature:
          type: string
          description: Ed25519 signature of the AgentEra self-revocation digest, encoded as canonical unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{86}$'
    CurrentLegalDocuments:
      type: object
      additionalProperties: false
      required: [terms_version, privacy_version]
      properties:
        terms_version:
          type: string
          maxLength: 64
        privacy_version:
          type: string
          maxLength: 64
    AuthorizationApprovalRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
          format: uuid
    AuthorizationApprovalResponse:
      type: object
      additionalProperties: false
      required: [redirect_uri]
      properties:
        redirect_uri:
          type: string
          format: uri
          pattern: '^http://127\.0\.0\.1:[1-9][0-9]{0,4}/agentera/oauth/callback\?'
    AuthorizationCodeExchangeRequest:
      type: object
      additionalProperties: false
      required: [authorization_code, code_verifier, installation_id, device_proof]
      properties:
        authorization_code:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
        installation_id:
          type: string
          format: uuid
        device_proof:
          type: string
          description: Ed25519 signature over the documented device-proof digest, encoded as unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{86}$'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - offline_entitlement
        - offline_expires_at
        - user_id
        - personal_space_id
        - device_id
      properties:
        access_token:
          type: string
          maxLength: 8192
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        refresh_expires_at:
          type: string
          format: date-time
        offline_entitlement:
          type: string
          maxLength: 8192
        offline_expires_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
    SigningKeySet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/SigningKey'
    SigningKey:
      type: object
      additionalProperties: false
      required: [kid, kty, crv, alg, use, purpose, x]
      properties:
        kid:
          type: string
        kty:
          const: OKP
        crv:
          const: Ed25519
        alg:
          const: EdDSA
        use:
          const: sig
        purpose:
          type: string
          enum: [access, offline_entitlement]
        x:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - verification_required
        - identity_conflict
        - invalid_credentials
        - device_limit_reached
        - authorization_expired
        - authorization_replayed
        - session_revoked
        - account_pending_deletion
        - account_disabled
        - last_identity
        - deletion_window_expired
        - account_not_found
        - device_not_found
        - self_revoke_replayed
        - service_unavailable
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              const: localized by the client
            request_id:
              type: string
              format: uuid
  responses:
    InvalidRequest:
      description: The request or verification receipt is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdentityConflict:
      description: The verified identity belongs to another account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidCredentials:
      description: Identity and password do not authenticate an active account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountUnavailable:
      description: The account is disabled or pending deletion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SessionRevoked:
      description: The browser session is absent, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: A required account service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
