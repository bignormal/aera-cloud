          format: uuid
        agent_installation_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
        runtime_profile_id:
          type: string
          format: uuid
        runtime_version:
          type: string
          minLength: 1
          maxLength: 64
        policy_snapshot_id:
          type: string
          format: uuid
        tool_permission_digest:
          $ref: '#/components/schemas/SHA256Digest'
    RuntimeBindingRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - agent_installation_id
        - agent_version_id
        - runtime_profile_id
        - runtime_version
        - policy_snapshot_id
        - tool_permission_digest
        - created_at
      properties:
        id:
          type: string
          format: uuid
        agent_installation_id:
          type: string
          format: uuid
        agent_version_id:
          type: string
          format: uuid
        runtime_profile_id:
          type: string
          format: uuid
        runtime_version:
          type: string
          minLength: 1
          maxLength: 64
        policy_snapshot_id:
          type: string
          format: uuid
        tool_permission_digest:
          $ref: '#/components/schemas/SHA256Digest'
        created_at:
          type: string
          format: date-time
    SHA256Digest:
      type: string
      description: Lowercase hexadecimal SHA-256 digest.
      pattern: '^[0-9a-f]{64}$'
    CurrentLegalDocuments:
      type: object
      additionalProperties: false
      required: [terms_version, privacy_version]
      properties:
        terms_version:
          type: string
          maxLength: 64
        privacy_version:
          type: string
          maxLength: 64
    AuthorizationApprovalRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
          format: uuid
    AuthorizationApprovalResponse:
      type: object
      additionalProperties: false
      required: [redirect_uri]
      properties:
        redirect_uri:
          type: string
          format: uri
          pattern: '^http://127\.0\.0\.1:[1-9][0-9]{0,4}/agentera/oauth/callback\?'
    AuthorizationCodeExchangeRequest:
      type: object
      additionalProperties: false
      required: [authorization_code, code_verifier, installation_id, device_proof]
      properties:
        authorization_code:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
        installation_id:
          type: string
          format: uuid
        device_proof:
          type: string
          description: Ed25519 signature over the documented device-proof digest, encoded as unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{86}$'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - offline_entitlement
        - offline_expires_at
        - user_id
        - personal_space_id
        - device_id
      properties:
        access_token:
          type: string
          maxLength: 8192
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        refresh_expires_at:
          type: string
          format: date-time
        offline_entitlement:
          type: string
          maxLength: 8192
        offline_expires_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
    SigningKeySet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/SigningKey'
    SigningKey:
      type: object
      additionalProperties: false
      required: [kid, kty, crv, alg, use, purpose, x]
      properties:
