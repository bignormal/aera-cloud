          minimum: 1
    TransferOrganizationOwnerRequest:
      type: object
      additionalProperties: false
      required:
        - target_user_id
        - expected_organization_revision
        - expected_owner_revision
        - expected_target_revision
        - confirmation
      properties:
        target_user_id:
          type: string
          format: uuid
        expected_organization_revision:
          type: integer
          format: int64
          minimum: 1
        expected_owner_revision:
          type: integer
          format: int64
          minimum: 1
        expected_target_revision:
          type: integer
          format: int64
          minimum: 1
