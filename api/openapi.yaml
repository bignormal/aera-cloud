    OfficialQualityEventRequest:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - consent_version
        - event_id
        - platform_id
        - definition_id
        - version_id
        - release_id
        - release_revision_id
        - desktop_version
        - runtime_version
        - event_day
        - kind
        - result
        - latency_bucket
        - total_token_bucket
        - crash_code
        - feedback_rating
        - feedback_reason_codes
        - binding_proof
        - device_signature
      properties:
        protocol_version:
          type: integer
          enum: [1]
        consent_version:
          type: integer
          format: int64
          minimum: 1
        event_id:
          type: string
          format: uuid
          description: Client-generated canonical UUIDv7 used for exact replay handling.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        platform_id: { type: string, format: uuid }
        definition_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        release_id: { type: string, format: uuid }
        release_revision_id: { type: string, format: uuid }
        desktop_version:
          type: string
          minLength: 1
          maxLength: 128
        runtime_version:
          type: string
          minLength: 1
          maxLength: 128
        event_day:
          type: string
          format: date
          description: UTC day no more than 30 days old and never in the future.
        kind:
          type: string
          enum: [metric, explicit_feedback]
        result:
          type: string
          enum: [success, user_cancelled, model_error, tool_error, runtime_crash, timeout]
        latency_bucket:
          type: string
          enum: [lt_1s, 1s_5s, 5s_15s, 15s_60s, 60s_180s, gte_180s]
        total_token_bucket:
          type: string
          enum: ['0', 1_1k, 1k_4k, 4k_16k, 16k_64k, gte_64k]
        crash_code:
          type: string
          nullable: true
          enum: [gateway_unavailable, runtime_process_exit, runtime_protocol_failure, unclassified_runtime_failure]
          description: Required as null unless result is runtime_crash.
        feedback_rating:
          type: string
          nullable: true
          enum: [helpful, not_helpful]
          description: Required as null for metric events.
        feedback_reason_codes:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [incorrect, incomplete, tool_failed, too_slow, unsafe_or_inappropriate, other_without_text]
          description: Non-null fixed-code list; metric events require an empty list.
        binding_proof:
          type: string
          format: uuid
          description: Opaque proof of the fixed official RuntimeBinding; not a session identifier.
        device_signature:
          type: string
          minLength: 86
          maxLength: 86
          pattern: '^[A-Za-z0-9_-]{86}$'
          description: Raw-base64url Ed25519 signature over the canonical content-free envelope.
    OfficialQualityEventReceipt:
      type: object
      additionalProperties: false
      required: [event_id, status]
      properties:
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, replayed] }
    OfficialQualityConsentRequest:
      type: object
      additionalProperties: false
