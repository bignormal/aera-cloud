        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-definitions/{definition_id}:
    get:
      operationId: getUserAgentDefinition
