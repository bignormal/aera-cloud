        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '429':
          $ref: '#/components/responses/WorkspaceRateLimited'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/agent-definitions:
    get:
      operationId: listUserAgentDefinitions
