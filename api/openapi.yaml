      properties:
        allowlist:
          type: array
          nullable: true
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:/-]{1,128}$'
    OrganizationExperienceCandidatePolicy:
      type: object
