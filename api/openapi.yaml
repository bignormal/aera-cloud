        profile_lineage_id:
          type: string
          format: uuid
        parent_backup_id:
          type: string
          format: uuid
          nullable: true
        source_device_id:
          type: string
          format: uuid
        source_installation_id:
          type: string
          format: uuid
        source_definition_id:
          type: string
          format: uuid
        source_version_id:
          type: string
          format: uuid
        format_version:
          type: integer
          enum: [1]
        cipher_suite:
          type: string
          enum: [HPKE-X25519-HKDF-SHA256-AES256GCM+ARGON2ID+AES256GCM]
