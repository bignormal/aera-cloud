        alg:
          const: EdDSA
        use:
          const: sig
        purpose:
          type: string
          enum: [access, offline_entitlement, agent_version, agent_policy]
        x:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - verification_required
        - identity_conflict
        - invalid_credentials
        - device_limit_reached
        - authorization_expired
        - authorization_replayed
        - session_revoked
        - account_pending_deletion
        - account_disabled
        - last_identity
        - deletion_window_expired
        - account_not_found
        - device_not_found
        - self_revoke_replayed
        - invalid_agent_content
        - runtime_incompatible
        - invalid_device_proof
        - not_found
        - version_conflict
        - idempotency_conflict
        - definition_archived
        - version_revoked
        - activation_conflict
        - installation_archived
        - workspace_forbidden
        - workspace_not_found
        - invitation_unavailable
        - workspace_conflict
        - workspace_archived
        - workspace_owner_unavailable
        - membership_conflict
        - workspace_limit_reached
        - member_limit_reached
        - invitation_limit_reached
        - rate_limited
        - service_unavailable
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
