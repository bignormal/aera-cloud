          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '409':
          $ref: '#/components/responses/EncryptedBackupConflict'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /api/v1/encrypted-profile-backups/devices/{device_id}:
    delete:
      operationId: revokeEncryptedBackupDevice
      description: Destroys every server-held root-key envelope for the selected same-account device.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupDeviceID'
      responses:
        '204':
          description: Device envelopes destroyed.
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /api/v1/encrypted-profile-backups/{backup_id}:
    get:
      operationId: getEncryptedProfileBackup
      description: Returns signed ciphertext inventory and only opaque encrypted restore envelopes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupID'
      responses:
        '200':
          description: Immutable ciphertext backup detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedBackupDetail'
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
    delete:
      operationId: deleteEncryptedProfileBackup
      description: Destroys key envelopes transactionally before idempotent ciphertext cleanup.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupID'
      responses:
        '204':
          description: Cryptographic deletion and current object cleanup completed.
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '409':
          $ref: '#/components/responses/EncryptedBackupConflict'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /api/v1/encrypted-profile-backups/{backup_id}/chunks/{chunk_index}:
    put:
      operationId: uploadEncryptedProfileBackupChunk
      description: Uploads one exact ciphertext chunk from the signed immutable inventory.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupID'
        - $ref: '#/components/parameters/EncryptedBackupChunkIndex'
        - $ref: '#/components/parameters/EncryptedBackupCiphertextSize'
        - $ref: '#/components/parameters/EncryptedBackupCiphertextDigest'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              minLength: 17
              maxLength: 9437200
      responses:
        '204':
          description: Exact ciphertext chunk stored or verified as an identical replay.
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '409':
          $ref: '#/components/responses/EncryptedBackupConflict'
        '410':
          $ref: '#/components/responses/EncryptedBackupExpired'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /api/v1/encrypted-profile-backups/{backup_id}/manifest:
    put:
      operationId: uploadEncryptedProfileBackupManifest
      description: Uploads the authenticated encrypted manifest bytes; Cloud never parses them.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupID'
        - $ref: '#/components/parameters/EncryptedBackupCiphertextSize'
        - $ref: '#/components/parameters/EncryptedBackupCiphertextDigest'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              minLength: 17
              maxLength: 16777216
      responses:
        '204':
          description: Exact encrypted manifest stored or verified as an identical replay.
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '409':
          $ref: '#/components/responses/EncryptedBackupConflict'
        '410':
          $ref: '#/components/responses/EncryptedBackupExpired'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /api/v1/encrypted-profile-backups/{backup_id}/seal:
    post:
      operationId: sealEncryptedProfileBackup
      description: Verifies every expected ciphertext object and atomically makes the backup restorable.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupID'
      responses:
        '200':
          description: Backup sealed or exact seal replay acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedBackupSealResponse'
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '409':
          $ref: '#/components/responses/EncryptedBackupConflict'
        '410':
          $ref: '#/components/responses/EncryptedBackupExpired'
        '413':
          $ref: '#/components/responses/EncryptedBackupQuotaExceeded'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /api/v1/encrypted-profile-backups/{backup_id}/objects/{object_id}:
    get:
      operationId: downloadEncryptedProfileBackupObject
      description: Downloads one same-account ciphertext object without any phrase or decryption key.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupID'
        - $ref: '#/components/parameters/EncryptedBackupObjectID'
      responses:
        '200':
          description: Exact stored ciphertext bytes.
          headers:
            X-AgentEra-Ciphertext-SHA256:
              required: true
              schema:
                $ref: '#/components/schemas/EncryptedBackupDigest'
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
                minimum: 17
                maximum: 16777216
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /api/v1/encrypted-profile-backups/{backup_id}/device-envelopes:
    post:
      operationId: addEncryptedBackupDeviceEnvelope
      description: Adds one opaque HPKE root-key envelope for an active same-account backup device.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/EncryptedBackupID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptedBackupAddDeviceEnvelopeRequest'
      responses:
        '200':
          description: Device envelope stored or exact replay acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedBackupAddDeviceEnvelopeResponse'
        '400':
          $ref: '#/components/responses/EncryptedBackupInvalidRequest'
        '401':
          $ref: '#/components/responses/EncryptedBackupAuthenticationRequired'
        '403':
          $ref: '#/components/responses/EncryptedBackupForbidden'
        '404':
          $ref: '#/components/responses/EncryptedBackupNotFound'
        '409':
          $ref: '#/components/responses/EncryptedBackupConflict'
        '503':
          $ref: '#/components/responses/EncryptedBackupServiceUnavailable'
  /.well-known/agentera-signing-keys.json:
    get:
      operationId: getAgentEraSigningKeys
      description: Returns current public keys for access, offline-entitlement, Agent version, Agent policy, and Organization policy verification.
      responses:
        '200':
          description: Public Ed25519 verification keys for every signed desktop control-plane artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeySet'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: agentera_browser_session
    desktopAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Aera access JWT
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    OptionalCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when browserSession is used; omitted for desktopAccessToken.
      schema:
        type: string
        minLength: 43
        maxLength: 43
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque operation key. The same key may be replayed only with the exact same request.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[^\\s\\x00]+$'
    OfficialAgentChannel:
      name: X-AgentEra-Official-Channel
      in: header
      required: true
      description: Trusted desktop-main release channel. Packaged builds use stable; the renderer cannot supply this value.
      schema:
        type: string
        enum: [internal, stable]
    OptionalOfficialAgentChannel:
      name: X-AgentEra-Official-Channel
      in: header
      required: false
      description: Required only for the OfficialAgentInstallationSource arm and derived by desktop main.
      schema:
        type: string
        enum: [internal, stable]
    OfficialDesktopVersion:
      name: X-AgentEra-Desktop-Version
      in: header
      required: true
      description: Trusted current desktop SemVer supplied by desktop main.
      schema:
        type: string
        minLength: 5
        maxLength: 128
        pattern: '^v?[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$'
    OptionalOfficialDesktopVersion:
      name: X-AgentEra-Desktop-Version
      in: header
      required: false
      description: Required only for the OfficialAgentInstallationSource arm and derived by desktop main.
      schema:
        type: string
        minLength: 5
        maxLength: 128
    OfficialProductContext:
      name: X-AgentEra-Product-Context
      in: header
      required: true
      description: Trusted currently selected product context. It is a policy selector and never Installation ownership.
      schema:
        type: string
        enum: [USER, WORKSPACE, ORGANIZATION]
    OptionalOfficialProductContext:
      name: X-AgentEra-Product-Context
      in: header
      required: false
      description: Required only for the OfficialAgentInstallationSource arm and derived by desktop main.
      schema:
        type: string
        enum: [USER, WORKSPACE, ORGANIZATION]
    OfficialProductContextID:
      name: X-AgentEra-Product-Context-ID
      in: header
      required: false
      description: Must be omitted for USER and must be the canonical selected Workspace or Organization UUID for shared contexts.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Actor-bound Organization operation key. Only its SHA-256 digest is persisted for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an Organization visible to the actor.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationUserID:
      name: user_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an Organization member.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationDepartmentID:
      name: department_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for a Department in the exact Organization.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an Organization invitation.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationPolicySnapshotID:
      name: policy_snapshot_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an immutable Organization policy snapshot.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OrganizationAgentSubmissionID:
      name: submission_id
      in: path
      required: true
      description: Canonical lowercase nonzero UUID for an immutable Organization Agent publication submission.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ExpectedOrganizationMemberRevision:
      name: expected_revision
      in: query
      required: true
      description: Positive Membership revision used for optimistic concurrency.
      schema:
        type: integer
        format: int64
        minimum: 1
    OrganizationPageLimit:
      name: limit
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    OrganizationCursor:
      name: cursor
      in: query
      required: false
      description: Opaque raw-base64url typed keyset cursor; the decoded payload is limited to 512 bytes and cannot cross collections.
      schema:
        type: string
        minLength: 1
        maxLength: 684
        pattern: '^[A-Za-z0-9_-]+$'
    WorkspaceIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque Workspace operation key, bounded to 128 UTF-8 bytes. Only its SHA-256 digest is persisted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace visible to the actor.
      schema:
        type: string
        format: uuid
    WorkspaceUserID:
      name: user_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace member.
      schema:
        type: string
        format: uuid
    WorkspaceInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace invitation.
      schema:
        type: string
        format: uuid
    ExpectedWorkspaceRevision:
      name: expected_revision
      in: query
      required: true
      description: Positive member revision used for optimistic concurrency.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentDefinitionID:
      name: definition_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExperienceCandidateID:
      name: candidate_id
      in: path
      required: true
      description: Canonical immutable ExperienceCandidate UUID within the exact Workspace.
      schema:
        type: string
        format: uuid
    AgentVersionID:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentPolicySnapshotID:
      name: policy_snapshot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentInstallationID:
      name: installation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EncryptedBackupID:
      name: backup_id
      in: path
      required: true
      description: Canonical nonzero UUID for the same-account encrypted backup.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    EncryptedBackupDeviceID:
      name: device_id
      in: path
      required: true
      description: Canonical nonzero UUID for a same-account authenticated device.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    EncryptedBackupObjectID:
      name: object_id
      in: path
      required: true
      description: Opaque random lowercase hexadecimal object identifier.
      schema:
        type: string
        minLength: 64
        maxLength: 64
        pattern: '^[0-9a-f]{64}$'
    EncryptedBackupChunkIndex:
      name: chunk_index
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 131071
    EncryptedBackupCiphertextSize:
      name: X-AgentEra-Ciphertext-Size
      in: header
      required: true
      description: Canonical decimal byte length that must equal Content-Length and the signed inventory.
      schema:
        type: integer
        format: int64
        minimum: 17
        maximum: 16777216
    EncryptedBackupCiphertextDigest:
      name: X-AgentEra-Ciphertext-SHA256
      in: header
      required: true
      description: Raw-base64url SHA-256 of the exact ciphertext request body.
      schema:
        $ref: '#/components/schemas/EncryptedBackupDigest'
  schemas:
    IdentityKind:
      type: string
      enum: [email, phone]
    VerificationPurpose:
      type: string
      enum: [registration, login, password_reset, bind_identity, account_deletion, deletion_recovery]
    VerificationChallengeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        captcha_token:
          type: string
          maxLength: 4096
    VerificationCodeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose, code]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    VerificationReceipt:
      type: object
      additionalProperties: false
      required: [status, receipt, expires_at]
      properties:
        status:
          type: string
          enum: [verified]
        receipt:
          type: string
          maxLength: 8192
        expires_at:
          type: string
          format: date-time
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required: [kind, verification_receipt, password, terms_version, privacy_version]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        verification_receipt:
          type: string
          maxLength: 8192
        password:
          type: string
          minLength: 10
          maxLength: 128
        nickname:
          type: string
          maxLength: 80
        terms_version:
          type: string
          maxLength: 64
        privacy_version:
          type: string
          maxLength: 64
    Registration:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
    BrowserLoginRequest:
      type: object
      additionalProperties: false
      required: [identity, password]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    BrowserCodeLoginRequest:
      type: object
      additionalProperties: false
      required: [verification_receipt]
      properties:
        verification_receipt:
          type: string
          maxLength: 8192
    BrowserLoginResponse:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, csrf_token]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [verification_receipt, new_password]
      properties:
        verification_receipt:
          type: string
          maxLength: 8192
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountProfile:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, status, identity_kinds, owned_workspace_count]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        status:
          type: string
          enum: [active]
        identity_kinds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityKind'
        owned_workspace_count:
          type: integer
          minimum: 0
          description: Exact number of active and archived Workspaces owned by this account; membership alone is not counted.
    CurrentPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
    IdentityBindingRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    AccountDeletionRecoveryRequest:
      type: object
      additionalProperties: false
      required: [identity, password, verification_receipt]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Device'
    Device:
      type: object
      additionalProperties: false
      required: [device_id, display_name, platform, app_version, status, last_seen_at, current]
      properties:
        device_id:
          type: string
