openapi: 3.0.3
info:
  title: Aera Cloud API
  version: 0.9.0
  description: Account, device authorization, USER, Workspace, Organization, Official Managed Agent, and opt-in content-free quality contracts for Aera.
servers:
  - url: https://accounts.agentera.example
paths:
  /api/v1/verification/challenges:
    post:
      operationId: createVerificationChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationChallengeRequest'
      responses:
        '202':
          description: Delivery accepted without disclosing account existence.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/verification/challenges/verify:
    post:
      operationId: verifyIdentityChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCodeRequest'
      responses:
        '200':
          description: Short-lived, single-use verification receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/register:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
      responses:
        '201':
          description: User and personal space created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/browser/login:
    post:
      operationId: browserLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserLoginRequest'
      responses:
        '200':
          description: Host-only browser session started. The response sets a short-lived session cookie and a separate persistent browser-session cookie for the configured retention period.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Multiple HttpOnly, SameSite=Lax browser-session cookies; the persistent cookie survives short-session expiry and is Secure outside loopback development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/browser/login/code:
    post:
      operationId: browserLoginWithCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserCodeLoginRequest'
      responses:
        '200':
          description: Host-only browser session started from a consumed login-purpose verification receipt. The response sets both short-lived and persistent browser-session cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Multiple HttpOnly, SameSite=Lax browser-session cookies; the persistent cookie survives short-session expiry and is Secure outside loopback development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLoginResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/browser/logout:
    post:
      operationId: browserLogout
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Browser session and its persistent browser-session credential ended.
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/password/reset:
    post:
      operationId: resetAccountPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password replaced and every existing device session family revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/me:
    get:
      operationId: getAccountProfile
      security:
        - browserSession: []
      responses:
        '200':
          description: Account and identity-kind metadata without email or phone values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/identities/bind:
    post:
      operationId: bindAccountIdentity
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityBindingRequest'
      responses:
        '204':
          description: Verified secondary identity bound after password reauthentication.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/identities/{kind}:
    delete:
      operationId: removeAccountIdentity
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdentityKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: Secondary login identity removed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          description: The only remaining login identity cannot be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/password/change:
    post:
      operationId: changeAccountPassword
      security:
        - desktopAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; the calling product session is preserved and every other device is revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/deletion:
    post:
      operationId: requestAccountDeletion
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account entered pending deletion and all cloud sessions, devices, and offline entitlements were revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          description: Account deletion is blocked until every owned Organization is transferred or dissolved; only the safe owned count is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionOwnershipErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/deletion/recover:
    post:
      operationId: recoverAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRecoveryRequest'
      responses:
        '204':
          description: Pending deletion recovered within seven days; old device sessions stay revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '410':
          description: The seven-day recovery window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices:
    get:
      operationId: listDevices
      security:
        - browserSession: []
        - desktopAccessToken: []
      responses:
        '200':
          description: Redacted active-device list without installation IDs or public keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/{device_id}:
    delete:
      operationId: revokeDevice
      security:
        - browserSession: []
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OptionalCSRFToken'
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device and its cloud sessions and offline entitlements revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          description: Device is not owned by the account or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/current/logout:
    post:
      operationId: logoutCurrentDevice
      security:
        - desktopAccessToken: []
      responses:
        '204':
          description: Calling device and all of its product sessions revoked.
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/self-revoke:
    post:
      operationId: selfRevokeDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSelfRevokeRequest'
      responses:
        '204':
          description: Device revoked after Ed25519 proof, nonce, and timestamp validation.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Signed device target is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Self-revocation nonce was already consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/legal/current:
    get:
      operationId: getCurrentLegalDocuments
      responses:
        '200':
          description: Versions that must be accepted for a new registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentLegalDocuments'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /oauth/authorize:
    get:
      operationId: beginDesktopAuthorization
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            enum: [agentera-studio]
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
            pattern: '^http://127\.0\.0\.1:[1-9][0-9]{0,4}/agentera/oauth/callback$'
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 1024
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: device_public_key
          in: query
          required: true
          description: Raw Ed25519 public key encoded as unpadded base64url.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: device_name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [darwin, windows, linux]
        - name: app_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: prompt
          in: query
          required: false
          description: Forces explicit browser account authentication when switching desktop users.
          schema:
            type: string
            enum: [select_account]
      responses:
        '303':
          description: Sensitive request values were persisted and removed from the browser URL.
          headers:
            Location:
              required: true
              schema:
                type: string
                description: Approval page, or a forced login page whose internal next target is the approval page.
                pattern: '^/(authorize\?request_id=|login\?next=)'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/authorize/approve:
    post:
      operationId: approveDesktopAuthorization
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationApprovalRequest'
      responses:
        '200':
          description: Exact loopback callback URL containing a one-time code and the original state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationApprovalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/token:
    post:
      operationId: exchangeDesktopAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCodeExchangeRequest'
      responses:
        '200':
          description: Device-bound product session and a new seven-day offline entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: The code was replayed or the five-active-device limit was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/refresh:
    post:
      operationId: refreshDesktopSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated refresh token, short-lived access token, and renewed offline entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/revoke:
    post:
      operationId: revokeDesktopSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: The refresh-token family was revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      description: Lists Organization memberships as safe control-plane summaries without login identities or Aera Runtime state.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationPageLimit'
        - $ref: '#/components/parameters/OrganizationCursor'
      responses:
        '200':
          description: Organizations visible to the authenticated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
          $ref: '#/components/responses/OrganizationAuthenticationRequired'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'
    post:
      operationId: createOrganization
      description: Creates an Organization, sole Owner Membership, and signed default policy atomically. The maximum request body is 81920 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '200':
          description: Safe current representation returned for an exact actor-bound replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '201':
          description: Organization created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
          $ref: '#/components/responses/OrganizationAuthenticationRequired'
        '409':
          $ref: '#/components/responses/OrganizationConflict'
        '413':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '429':
          $ref: '#/components/responses/OrganizationRateLimited'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'
  /api/v1/organizations/{organization_id}:
    get:
      operationId: getOrganization
      description: Returns one safe Organization summary visible to its authenticated member.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Organization summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
          $ref: '#/components/responses/OrganizationAuthenticationRequired'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'
    patch:
      operationId: renameOrganization
      description: Renames one active Organization at an exact revision. The maximum request body is 81920 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameOrganizationRequest'
      responses:
        '200':
          description: Updated Organization summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
          $ref: '#/components/responses/OrganizationAuthenticationRequired'
        '403':
          $ref: '#/components/responses/OrganizationForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OrganizationConflict'
        '413':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '429':
          $ref: '#/components/responses/OrganizationRateLimited'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'
  /api/v1/organizations/{organization_id}/archive:
    post:
      operationId: archiveOrganization
      description: Archives an Organization and revokes pending invitations at the exact revision.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/OrganizationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRevisionRequest'
      responses:
        '200':
          description: Archived Organization summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
          $ref: '#/components/responses/OrganizationAuthenticationRequired'
        '403':
          $ref: '#/components/responses/OrganizationForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OrganizationConflict'
        '413':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '429':
          $ref: '#/components/responses/OrganizationRateLimited'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'
  /api/v1/organizations/{organization_id}/restore:
    post:
      operationId: restoreOrganization
      description: Restores an archived Organization after rechecking Owner quota.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/OrganizationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRevisionRequest'
      responses:
        '200':
          description: Restored Organization summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
          $ref: '#/components/responses/OrganizationAuthenticationRequired'
        '403':
          $ref: '#/components/responses/OrganizationForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OrganizationConflict'
        '413':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '429':
          $ref: '#/components/responses/OrganizationRateLimited'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'
  /api/v1/organizations/{organization_id}/owner-transfer:
    post:
      operationId: transferOrganizationOwner
      description: Atomically demotes the current Owner and promotes one active existing Admin after exact confirmation and revision checks.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/OrganizationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOrganizationOwnerRequest'
      responses:
        '200':
          description: Organization summary projected for the former Owner after transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
          $ref: '#/components/responses/OrganizationAuthenticationRequired'
        '403':
          $ref: '#/components/responses/OrganizationForbidden'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/OrganizationConflict'
        '413':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '429':
          $ref: '#/components/responses/OrganizationRateLimited'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'
  /api/v1/organizations/{organization_id}/dissolve:
    post:
      operationId: dissolveOrganization
      description: Permanently dissolves an archived empty Organization after exact name, revision, confirmation, and asset-guard checks.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/OrganizationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DissolveOrganizationRequest'
      responses:
        '200':
          description: Anonymous terminal Organization tombstone summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/OrganizationInvalidRequest'
        '401':
