        backups:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/EncryptedBackupSummary'
    EncryptedBackupCurrentDeviceEnvelope:
      type: object
      additionalProperties: false
      required: [device_id, key_epoch, root_key_envelope, root_key_envelope_digest]
      properties:
        device_id:
          type: string
          format: uuid
        key_epoch:
          type: integer
          format: int64
          minimum: 1
        root_key_envelope:
          $ref: '#/components/schemas/EncryptedBackupOpaqueEnvelope'
        root_key_envelope_digest:
          $ref: '#/components/schemas/EncryptedBackupDigest'
    EncryptedBackupDetail:
      type: object
      additionalProperties: false
      required:
        - backup_id
        - profile_lineage_id
        - parent_backup_id
        - source_device_id
        - source_installation_id
        - source_definition_id
        - source_version_id
        - format_version
        - cipher_suite
        - state
        - key_epoch
        - chunk_count
        - total_ciphertext_size
        - created_at
        - sealed_at
        - manifest
        - chunks
        - public_envelope_digest
        - public_signature
        - source_device_public_key
        - source_device_envelope_digest
        - recovery
        - recovery_root_key_envelope
        - wrapped_data_key
        - current_device_envelope
      properties:
        backup_id:
          type: string
          format: uuid
        profile_lineage_id:
          type: string
          format: uuid
        parent_backup_id:
          type: string
          format: uuid
          nullable: true
        source_device_id:
          type: string
          format: uuid
        source_installation_id:
          type: string
          format: uuid
        source_definition_id:
          type: string
          format: uuid
        source_version_id:
          type: string
          format: uuid
        format_version:
          type: integer
          enum: [1]
        cipher_suite:
          type: string
          enum: [HPKE-X25519-HKDF-SHA256-AES256GCM+ARGON2ID+AES256GCM]
        state:
          $ref: '#/components/schemas/EncryptedBackupState'
        key_epoch:
          type: integer
          format: int64
          minimum: 1
        chunk_count:
          type: integer
          minimum: 1
          maximum: 131072
        total_ciphertext_size:
          type: integer
          format: int64
          minimum: 17
          maximum: 1073741824
        created_at:
          type: string
          format: date-time
        sealed_at:
          type: string
          format: date-time
          nullable: true
        manifest:
          $ref: '#/components/schemas/EncryptedBackupObjectSpec'
        chunks:
          type: array
          minItems: 1
          maxItems: 131072
          items:
            $ref: '#/components/schemas/EncryptedBackupChunkSpec'
        public_envelope_digest:
          $ref: '#/components/schemas/EncryptedBackupDigest'
        public_signature:
          $ref: '#/components/schemas/EncryptedBackupSignature'
        source_device_public_key:
          type: string
          description: Raw-base64url 32-byte Ed25519 key used only to verify the immutable public envelope signature.
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        source_device_envelope_digest:
          $ref: '#/components/schemas/EncryptedBackupDigest'
        recovery:
          $ref: '#/components/schemas/EncryptedBackupRecoveryParameters'
        recovery_root_key_envelope:
          $ref: '#/components/schemas/EncryptedBackupOpaqueEnvelope'
        wrapped_data_key:
          $ref: '#/components/schemas/EncryptedBackupOpaqueEnvelope'
        current_device_envelope:
          allOf:
            - $ref: '#/components/schemas/EncryptedBackupCurrentDeviceEnvelope'
          nullable: true
    EncryptedBackupAddDeviceEnvelopeRequest:
      type: object
      additionalProperties: false
      required: [device_id, key_epoch, root_key_envelope, root_key_envelope_digest]
      properties:
        device_id:
          type: string
          format: uuid
        key_epoch:
          type: integer
          format: int64
          minimum: 1
        root_key_envelope:
          $ref: '#/components/schemas/EncryptedBackupOpaqueEnvelope'
        root_key_envelope_digest:
          $ref: '#/components/schemas/EncryptedBackupDigest'
    EncryptedBackupAddDeviceEnvelopeResponse:
      type: object
      additionalProperties: false
      required: [backup_id, device_id, key_epoch, replayed]
      properties:
        backup_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        key_epoch:
          type: integer
          format: int64
          minimum: 1
        replayed:
          type: boolean
    EncryptedBackupSealResponse:
      type: object
      additionalProperties: false
      required: [backup_id, state, sealed_at, replayed]
      properties:
        backup_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/EncryptedBackupState'
        sealed_at:
          type: string
          format: date-time
          nullable: true
        replayed:
          type: boolean
    EncryptedBackupErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_signature
            - session_revoked
            - not_authorized
            - backup_not_found
            - backup_conflict
            - upload_expired
            - quota_exceeded
            - feature_unavailable
            - service_unavailable
    SigningKeySet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 5
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SigningKey'
    SigningKey:
      type: object
      additionalProperties: false
      required: [kid, kty, crv, alg, use, purpose, x]
      properties:
        kid:
          type: string
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        alg:
          type: string
          enum: [EdDSA]
        use:
          type: string
          enum: [sig]
        purpose:
          type: string
          enum: [access, offline_entitlement, agent_version, agent_policy, organization_policy]
        x:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - verification_required
        - identity_conflict
        - invalid_credentials
        - device_limit_reached
        - authorization_expired
        - authorization_replayed
        - session_revoked
        - account_pending_deletion
        - account_disabled
        - last_identity
        - deletion_window_expired
        - account_not_found
        - device_not_found
        - self_revoke_replayed
        - invalid_agent_content
        - invalid_experience_candidate
        - candidate_dlp_blocked
        - candidate_already_reviewed
        - runtime_incompatible
        - invalid_device_proof
        - not_found
        - version_conflict
        - idempotency_conflict
        - definition_archived
        - version_revoked
        - activation_conflict
        - installation_archived
        - workspace_forbidden
        - workspace_not_found
        - invitation_unavailable
        - invitation_expired
        - invitation_revoked
        - invitation_used
        - workspace_conflict
        - workspace_archived
        - workspace_owner_unavailable
        - membership_conflict
        - workspace_limit_reached
        - member_limit_reached
        - invitation_limit_reached
        - organization_owner_transfer_required
        - organization_agent_not_found
        - organization_agent_forbidden
        - organization_archived
        - organization_submission_conflict
        - organization_submission_superseded
        - organization_publication_policy_blocked
        - organization_publication_dlp_blocked
        - official_agent_not_eligible
        - official_release_paused
        - official_release_revision_conflict
        - official_client_version_unsupported
        - official_installation_policy_blocked
        - official_managed_update_conflict
        - cloud_unavailable
        - rate_limited
        - service_unavailable
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              enum: [localized by the client]
            request_id:
              type: string
              format: uuid
  responses:
    EncryptedBackupInvalidRequest:
      description: The encrypted backup request, binary headers, identifier, or exact ciphertext metadata is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    EncryptedBackupAuthenticationRequired:
      description: The desktop access token is absent, malformed, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    EncryptedBackupForbidden:
      description: The account or current device is not authorized for this encrypted backup operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    EncryptedBackupNotFound:
      description: The encrypted backup or ciphertext object is absent or outside the authenticated account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    EncryptedBackupConflict:
      description: Immutable inventory, lifecycle, signature replay, device revision, or completeness conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    EncryptedBackupExpired:
      description: The bounded ciphertext upload window expired before sealing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    EncryptedBackupQuotaExceeded:
      description: The one GiB backup, three-backup lineage, or five GiB account ciphertext quota was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    EncryptedBackupServiceUnavailable:
      description: Encrypted backup storage is disabled or a required fail-closed dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EncryptedBackupErrorEnvelope'
    InvalidRequest:
      description: The request or verification receipt is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdentityConflict:
      description: The verified identity belongs to another account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidCredentials:
      description: Identity and password do not authenticate an active account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountUnavailable:
      description: The account is disabled or pending deletion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SessionRevoked:
      description: The browser session is absent, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentNotFound:
      description: The USER or Workspace Agent object is absent or outside the authenticated owner or membership boundary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentWorkspaceForbidden:
      description: The authenticated Workspace member lacks the Owner or Admin role required to publish.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentConflict:
      description: The Agent version, installation, revocation, or idempotency state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentInstallationError:
      description: A normal, Organization-source, or Official-source Installation authorization, policy, conflict, compatibility, or availability result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OrganizationAgentError:
      description: Organization Agent validation, authorization, lifecycle, approval, DLP, policy, idempotency, or service result without private evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationAgentErrorEnvelope'
    OfficialAgentError:
      description: Bounded official Agent eligibility, release, compatibility, policy, conflict, or Cloud availability result without rollout or allowlist evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OfficialQualityInvalidRequest:
      description: The bounded event, consent body, content type, signature encoding, or request size is invalid or privacy-rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfficialQualityErrorEnvelope'
    OfficialQualitySessionRevoked:
      description: The desktop access token is absent, malformed, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfficialQualityErrorEnvelope'
    OfficialQualityForbidden:
      description: Consent is missing or the supplied official release provenance or device signature is ineligible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfficialQualityErrorEnvelope'
    OfficialQualityConflict:
      description: The event identifier or fixed RuntimeBinding proof conflicts with a previously accepted envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfficialQualityErrorEnvelope'
    OfficialQualityRateLimited:
      description: The independent purpose-specific request or rotating-subject limit was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfficialQualityErrorEnvelope'
    OfficialQualityServiceUnavailable:
      description: Quality collection could not prove a safe result; Agent execution remains independent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfficialQualityErrorEnvelope'
    ExperienceCandidateError:
      description: Candidate validation, DLP, visibility, Workspace lifecycle, terminal review, idempotency, or service failure without private evidence text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExperienceCandidateErrorEnvelope'
    WorkspaceInvalidRequest:
      description: The Workspace request, identifier, revision, content type, or bounded body is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceSessionRevoked:
      description: The desktop access token is absent, expired, malformed, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceForbidden:
      description: A known Workspace member lacks the role required for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceNotFound:
      description: The Workspace is absent or hidden from this actor, or an invitation is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceConflict:
      description: Workspace lifecycle, revision, membership, quota, or idempotency state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceRateLimited:
      description: A bounded Workspace creation, invitation creation, or invitation acceptance limit was exceeded.
      headers:
        Retry-After:
          required: true
          description: Positive whole seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceServiceUnavailable:
      description: A required Workspace control-plane dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    OrganizationInvalidRequest:
      description: The Organization request, identifier, revision, content type, or bounded body is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationAuthenticationRequired:
      description: The desktop access token is absent, expired, malformed, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationForbidden:
      description: A known Organization member lacks the role required for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationNotFound:
      description: The Organization object is absent or hidden from this actor, or an invitation is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationConflict:
      description: Organization lifecycle, revision, membership, quota, policy, invitation-use, or idempotency state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationInvitationGone:
      description: The Organization invitation expired or was revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationRateLimited:
      description: A bounded Organization creation, invitation, or acceptance limit was exceeded.
      headers:
        Retry-After:
          required: true
          description: Positive whole seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationServiceUnavailable:
      description: A required Organization control-plane dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    ServiceUnavailable:
      description: A required account service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
