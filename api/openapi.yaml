        model_constraints:
          $ref: '#/components/schemas/AgentModelConstraintsV1'
        tools:
          $ref: '#/components/schemas/AgentToolPolicyV1'
        dependencies:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/AgentDependencyV1'
        runtime_compatibility:
          $ref: '#/components/schemas/AgentRuntimeCompatibilityV1'
