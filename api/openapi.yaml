        '201':
          description: Immutable next version published and selected as latest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPublication'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-versions/{version_id}:
    get:
      operationId: getUserAgentVersion
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentVersionID'
