      properties:
        policy_document:
          $ref: '#/components/schemas/OrganizationPolicyDocument'
        expected_organization_revision:
          type: integer
          format: int64
          minimum: 1
        expected_policy_version:
          type: integer
          format: int64
          minimum: 2
    OrganizationErrorCode:
      type: string
      enum:
        - invalid_request
        - authentication_required
        - organization_forbidden
        - organization_not_found
        - invitation_unavailable
        - organization_conflict
        - organization_archived
        - organization_limit_reached
        - organization_owner_transfer_required
        - owner_transfer_target_invalid
        - membership_conflict
        - member_limit_reached
        - department_not_empty
        - department_limit_reached
        - invitation_limit_reached
        - policy_version_conflict
        - idempotency_conflict
        - dissolution_blocked
        - rate_limited
        - service_unavailable
    OrganizationErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              $ref: '#/components/schemas/OrganizationErrorCode'
            request_id:
              type: string
              minLength: 1
              maxLength: 128
    SigningKeySet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 5
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SigningKey'
    SigningKey:
      type: object
      additionalProperties: false
      required: [kid, kty, crv, alg, use, purpose, x]
      properties:
        kid:
          type: string
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        alg:
          type: string
          enum: [EdDSA]
        use:
          type: string
          enum: [sig]
        purpose:
          type: string
          enum: [access, offline_entitlement, agent_version, agent_policy, organization_policy]
        x:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - verification_required
        - identity_conflict
        - invalid_credentials
        - device_limit_reached
        - authorization_expired
        - authorization_replayed
        - session_revoked
        - account_pending_deletion
        - account_disabled
        - last_identity
        - deletion_window_expired
        - account_not_found
        - device_not_found
        - self_revoke_replayed
        - invalid_agent_content
        - invalid_experience_candidate
        - candidate_dlp_blocked
        - candidate_already_reviewed
        - runtime_incompatible
        - invalid_device_proof
        - not_found
        - version_conflict
        - idempotency_conflict
        - definition_archived
        - version_revoked
        - activation_conflict
        - installation_archived
        - workspace_forbidden
        - workspace_not_found
        - invitation_unavailable
        - workspace_conflict
        - workspace_archived
        - workspace_owner_unavailable
        - membership_conflict
        - workspace_limit_reached
        - member_limit_reached
        - invitation_limit_reached
        - organization_owner_transfer_required
        - rate_limited
        - service_unavailable
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              enum: [localized by the client]
            request_id:
              type: string
              format: uuid
  responses:
    InvalidRequest:
      description: The request or verification receipt is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdentityConflict:
      description: The verified identity belongs to another account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidCredentials:
      description: Identity and password do not authenticate an active account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountUnavailable:
      description: The account is disabled or pending deletion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SessionRevoked:
      description: The browser session is absent, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentNotFound:
      description: The USER or Workspace Agent object is absent or outside the authenticated owner or membership boundary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentWorkspaceForbidden:
      description: The authenticated Workspace member lacks the Owner or Admin role required to publish.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentConflict:
      description: The Agent version, installation, revocation, or idempotency state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExperienceCandidateError:
      description: Candidate validation, DLP, visibility, Workspace lifecycle, terminal review, idempotency, or service failure without private evidence text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExperienceCandidateErrorEnvelope'
    WorkspaceInvalidRequest:
      description: The Workspace request, identifier, revision, content type, or bounded body is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceSessionRevoked:
      description: The desktop access token is absent, expired, malformed, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceForbidden:
      description: A known Workspace member lacks the role required for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceNotFound:
      description: The Workspace is absent or hidden from this actor, or an invitation is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceConflict:
      description: Workspace lifecycle, revision, membership, quota, or idempotency state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceRateLimited:
      description: A bounded Workspace creation, invitation creation, or invitation acceptance limit was exceeded.
      headers:
        Retry-After:
          required: true
          description: Positive whole seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    WorkspaceServiceUnavailable:
      description: A required Workspace control-plane dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceErrorEnvelope'
    OrganizationInvalidRequest:
      description: The Organization request, identifier, revision, content type, or bounded body is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationAuthenticationRequired:
      description: The desktop access token is absent, expired, malformed, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationForbidden:
      description: A known Organization member lacks the role required for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationNotFound:
      description: The Organization object is absent or hidden from this actor, or an invitation is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationConflict:
      description: Organization lifecycle, revision, membership, quota, policy, or idempotency state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationRateLimited:
      description: A bounded Organization creation, invitation, or acceptance limit was exceeded.
      headers:
        Retry-After:
          required: true
          description: Positive whole seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    OrganizationServiceUnavailable:
      description: A required Organization control-plane dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationErrorEnvelope'
    ServiceUnavailable:
      description: A required account service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
