          pattern: '^[A-Za-z0-9._:/-]{1,128}$'
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:/-]{1,128}$'
    OrganizationModelPolicy:
