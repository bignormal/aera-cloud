      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentPolicySnapshotID'
      responses:
        '200':
          description: Signed immutable Agent installation policy snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPolicySnapshot'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-versions/{version_id}/revocations:
    post:
      operationId: revokeUserAgentVersion
      description: The maximum Agent metadata request body is 65536 bytes. Revocation is append-only and never mutates an immutable version.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentVersionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAgentVersionRequest'
      responses:
        '201':
          description: Version revocation appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionRevocation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-installations:
    post:
      operationId: createUserAgentInstallation
      description: The maximum Agent metadata request body is 65536 bytes. The authenticated device determines installation ownership.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentInstallationRequest'
      responses:
        '201':
          description: Pending installation and signed policy snapshot created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallationCreation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-installations/{installation_id}/activate:
    post:
      operationId: activateUserAgentInstallation
      description: The maximum Agent metadata request body is 65536 bytes. Device proof binds the signed version digest to one local Runtime profile.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentInstallationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAgentInstallationRequest'
      responses:
        '200':
          description: Installation activated or an exact activation replay returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-installations/{installation_id}/select-version:
    post:
      operationId: selectUserAgentInstallationVersion
      description: The maximum Agent metadata request body is 65536 bytes. A newly selected version applies only to later Runtime bindings.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentInstallationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectAgentInstallationVersionRequest'
      responses:
        '200':
          description: Installation selected version and signed policy snapshot updated atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/agent-installations/{installation_id}/archive:
    post:
      operationId: archiveUserAgentInstallation
      description: The maximum Agent metadata request body is 65536 bytes. Archive changes cloud control metadata only and does not delete a Hermes profile.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/AgentInstallationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAgentInstallationRequest'
      responses:
        '200':
          description: Installation archived without deleting local runtime state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstallation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/runtime-binding-records:
    post:
      operationId: recordUserAgentRuntimeBinding
      description: The maximum Agent metadata request body is 65536 bytes. This records immutable control-plane identifiers and never uploads session, Memory, files, or credentials.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuntimeBindingRecordRequest'
      responses:
        '201':
          description: Runtime binding record persisted for a newly starting session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBindingRecord'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '413':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /.well-known/agentera-signing-keys.json:
    get:
      operationId: getAgentEraSigningKeys
      responses:
        '200':
          description: Public Ed25519 access and offline-entitlement verification keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeySet'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: agentera_browser_session
    desktopAccessToken:
      type: http
      scheme: bearer
      bearerFormat: AgentEra access JWT
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    OptionalCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when browserSession is used; omitted for desktopAccessToken.
      schema:
        type: string
        minLength: 43
        maxLength: 43
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque operation key. The same key may be replayed only with the exact same request.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[^\\s\\x00]+$'
    WorkspaceIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque Workspace operation key, bounded to 128 UTF-8 bytes. Only its SHA-256 digest is persisted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace visible to the actor.
      schema:
        type: string
        format: uuid
    WorkspaceUserID:
      name: user_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace member.
      schema:
        type: string
        format: uuid
    WorkspaceInvitationID:
      name: invitation_id
      in: path
      required: true
      description: Canonical lowercase UUID for a Workspace invitation.
      schema:
        type: string
        format: uuid
    ExpectedWorkspaceRevision:
      name: expected_revision
      in: query
      required: true
      description: Positive member revision used for optimistic concurrency.
      schema:
        type: integer
        format: int64
        minimum: 1
    AgentDefinitionID:
      name: definition_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentVersionID:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentPolicySnapshotID:
      name: policy_snapshot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentInstallationID:
      name: installation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    IdentityKind:
      type: string
      enum: [email, phone]
    VerificationPurpose:
      type: string
      enum: [registration, password_reset, bind_identity, account_deletion, deletion_recovery]
    VerificationChallengeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        captcha_token:
          type: string
          maxLength: 4096
    VerificationCodeRequest:
      type: object
      additionalProperties: false
      required: [kind, destination, purpose, code]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        destination:
          type: string
          maxLength: 254
        purpose:
          $ref: '#/components/schemas/VerificationPurpose'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    VerificationReceipt:
      type: object
      additionalProperties: false
      required: [status, receipt, expires_at]
      properties:
        status:
          const: verified
        receipt:
          type: string
          maxLength: 8192
        expires_at:
          type: string
          format: date-time
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required: [kind, verification_receipt, password, terms_version, privacy_version]
      properties:
        kind:
          $ref: '#/components/schemas/IdentityKind'
        verification_receipt:
          type: string
          maxLength: 8192
        password:
          type: string
          minLength: 10
          maxLength: 128
        nickname:
          type: string
          maxLength: 80
        terms_version:
          type: string
          maxLength: 64
        privacy_version:
          type: string
          maxLength: 64
    Registration:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
    BrowserLoginRequest:
      type: object
      additionalProperties: false
      required: [identity, password]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
    BrowserLoginResponse:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, csrf_token]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [verification_receipt, new_password]
      properties:
        verification_receipt:
          type: string
          maxLength: 8192
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountProfile:
      type: object
      additionalProperties: false
      required: [user_id, personal_space_id, status, identity_kinds, owned_workspace_count]
      properties:
        user_id:
          type: string
          format: uuid
        personal_space_id:
          type: string
          format: uuid
        nickname:
          type: string
          maxLength: 80
        status:
          const: active
        identity_kinds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IdentityKind'
        owned_workspace_count:
          type: integer
          minimum: 0
          description: Exact number of active and archived Workspaces owned by this account; membership alone is not counted.
    CurrentPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
    IdentityBindingRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [current_password, verification_receipt]
      properties:
        current_password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    AccountDeletionRecoveryRequest:
      type: object
      additionalProperties: false
      required: [identity, password, verification_receipt]
      properties:
        identity:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        verification_receipt:
          type: string
          maxLength: 8192
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Device'
    Device:
      type: object
      additionalProperties: false
      required: [device_id, display_name, platform, app_version, status, last_seen_at, current]
      properties:
        device_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [darwin, windows, linux]
        app_version:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active, inactive, revoked]
        last_seen_at:
          type: string
          format: date-time
        current:
          type: boolean
    DeviceSelfRevokeRequest:
      type: object
      additionalProperties: false
      required: [device_id, installation_id, timestamp, nonce, signature]
      properties:
        device_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        timestamp:
          type: integer
          format: int64
        nonce:
          type: string
          description: 32 random bytes encoded as canonical unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{43}$'
        signature:
          type: string
          description: Ed25519 signature of the AgentEra self-revocation digest, encoded as canonical unpadded base64url.
          pattern: '^[A-Za-z0-9_-]{86}$'
    WorkspaceRole:
      type: string
      enum: [owner, admin, member]
    WorkspaceStatus:
      type: string
      enum: [active, archived]
    WorkspaceMutationState:
      type: string
