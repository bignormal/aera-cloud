          format: uuid
        accepted_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    WorkspaceInvitationCreation:
      type: object
      additionalProperties: false
      required: [id, status, created_at, expires_at, secret_replayable]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WorkspaceInvitationStatus'
        created_by_user_id:
          type: string
          format: uuid
        accepted_by_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
