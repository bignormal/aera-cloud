openapi: 3.1.0
info:
  title: AgentEra App Cloud API
  version: 0.3.0
  description: Account, device authorization, USER-owned Agent, and Workspace control-plane contract for AgentEra Studio.
servers:
  - url: https://accounts.agentera.example
paths:
  /api/v1/verification/challenges:
    post:
      operationId: createVerificationChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationChallengeRequest'
      responses:
        '202':
          description: Delivery accepted without disclosing account existence.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/verification/challenges/verify:
    post:
      operationId: verifyIdentityChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCodeRequest'
      responses:
        '200':
          description: Short-lived, single-use verification receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReceipt'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/register:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
      responses:
        '201':
          description: User and personal space created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/browser/login:
    post:
      operationId: browserLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserLoginRequest'
      responses:
        '200':
          description: Host-only browser session started.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly, SameSite=Lax browser session cookie; Secure outside loopback development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/browser/logout:
    post:
      operationId: browserLogout
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Browser session ended.
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/password/reset:
    post:
      operationId: resetAccountPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password replaced and every existing device session family revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/me:
    get:
      operationId: getAccountProfile
      security:
        - browserSession: []
      responses:
        '200':
          description: Account and identity-kind metadata without email or phone values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/identities/bind:
    post:
      operationId: bindAccountIdentity
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityBindingRequest'
      responses:
        '204':
          description: Verified secondary identity bound after password reauthentication.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/identities/{kind}:
    delete:
      operationId: removeAccountIdentity
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdentityKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordRequest'
      responses:
        '204':
          description: Secondary login identity removed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          description: The only remaining login identity cannot be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/password/change:
    post:
      operationId: changeAccountPassword
      security:
        - desktopAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; the calling product session is preserved and every other device is revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/deletion:
    post:
      operationId: requestAccountDeletion
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account entered pending deletion and all cloud sessions, devices, and offline entitlements were revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/deletion/recover:
    post:
      operationId: recoverAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRecoveryRequest'
      responses:
        '204':
          description: Pending deletion recovered within seven days; old device sessions stay revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '410':
          description: The seven-day recovery window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices:
    get:
      operationId: listDevices
      security:
        - browserSession: []
        - desktopAccessToken: []
      responses:
        '200':
          description: Redacted active-device list without installation IDs or public keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/{device_id}:
    delete:
      operationId: revokeDevice
      security:
        - browserSession: []
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/OptionalCSRFToken'
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device and its cloud sessions and offline entitlements revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '404':
          description: Device is not owned by the account or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/current/logout:
    post:
      operationId: logoutCurrentDevice
      security:
        - desktopAccessToken: []
      responses:
        '204':
          description: Calling device and all of its product sessions revoked.
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/self-revoke:
    post:
      operationId: selfRevokeDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSelfRevokeRequest'
      responses:
        '204':
          description: Device revoked after Ed25519 proof, nonce, and timestamp validation.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Signed device target is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Self-revocation nonce was already consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/legal/current:
    get:
      operationId: getCurrentLegalDocuments
      responses:
        '200':
          description: Versions that must be accepted for a new registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentLegalDocuments'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /oauth/authorize:
    get:
      operationId: beginDesktopAuthorization
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            enum: [agentera-studio]
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
            pattern: '^http://127\.0\.0\.1:[1-9][0-9]{0,4}/agentera/oauth/callback$'
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 1024
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: device_public_key
          in: query
          required: true
          description: Raw Ed25519 public key encoded as unpadded base64url.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: device_name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [darwin, windows, linux]
        - name: app_version
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: prompt
          in: query
          required: false
          description: Forces explicit browser account authentication when switching desktop users.
          schema:
            type: string
            enum: [select_account]
      responses:
        '303':
          description: Sensitive request values were persisted and removed from the browser URL.
          headers:
            Location:
              required: true
              schema:
                type: string
                description: Approval page, or a forced login page whose internal next target is the approval page.
                pattern: '^/(authorize\?request_id=|login\?next=)'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/authorize/approve:
    post:
      operationId: approveDesktopAuthorization
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationApprovalRequest'
      responses:
        '200':
          description: Exact loopback callback URL containing a one-time code and the original state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationApprovalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/token:
    post:
      operationId: exchangeDesktopAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCodeExchangeRequest'
      responses:
        '200':
          description: Device-bound product session and a new seven-day offline entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: The code was replayed or the five-active-device limit was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/refresh:
    post:
      operationId: refreshDesktopSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated refresh token, short-lived access token, and renewed offline entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/AccountUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/oauth/revoke:
    post:
      operationId: revokeDesktopSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: The refresh-token family was revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      description: Lists active and archived Workspace memberships without local Hermes state.
      security:
        - desktopAccessToken: []
      responses:
        '200':
          description: Workspaces visible to the authenticated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
    post:
      operationId: createWorkspace
      description: Creates a Workspace and fixed Owner membership. The maximum request body is 16384 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '200':
          description: Safe current representation returned for an exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '201':
          description: Workspace and fixed Owner membership created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '429':
          $ref: '#/components/responses/WorkspaceRateLimited'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}:
    patch:
      operationId: renameWorkspace
      description: Renames one writable Workspace. The maximum request body is 16384 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameWorkspaceRequest'
      responses:
        '200':
          description: Updated Workspace summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}/archive:
    post:
      operationId: archiveWorkspace
      description: Archives one Workspace and revokes its pending invitations. The maximum request body is 16384 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRevisionRequest'
      responses:
        '200':
          description: Archived Workspace summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}/restore:
    post:
      operationId: restoreWorkspace
      description: Restores one archived Workspace after rechecking Owner quota. The maximum request body is 16384 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRevisionRequest'
      responses:
        '200':
          description: Restored Workspace summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummary'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}/members:
    get:
      operationId: listWorkspaceMembers
      description: Lists safe member metadata without login identities.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Members visible to the authenticated Workspace member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberListResponse'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}/members/{user_id}:
    patch:
      operationId: changeWorkspaceMemberRole
      description: Promotes a Member to Admin or demotes an Admin to Member. The maximum request body is 16384 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/WorkspaceUserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeWorkspaceMemberRoleRequest'
      responses:
        '200':
          description: Updated member summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
    delete:
      operationId: removeWorkspaceMember
      description: Removes an authorized non-Owner target at the expected member revision.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/WorkspaceUserID'
        - $ref: '#/components/parameters/ExpectedWorkspaceRevision'
      responses:
        '204':
          description: Member removed.
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}/leave:
    post:
      operationId: leaveWorkspace
      description: Lets an Admin or Member leave. The fixed Owner cannot leave. The maximum request body is 16384 bytes.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '204':
          description: Actor membership removed.
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}/invitations:
    get:
      operationId: listWorkspaceInvitations
      description: Lists invitation metadata without raw invitation tokens.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
      responses:
        '200':
          description: Sanitized invitations visible to Owner or Admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationListResponse'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
    post:
      operationId: createWorkspaceInvitation
      description: Creates a seven-day Member invitation. The maximum request body is 16384 bytes; the secret appears only on the first 201 response.
      security:
        - desktopAccessToken: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceID'
        - $ref: '#/components/parameters/WorkspaceIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Safe invitation summary for an exact replay; token and invite_url are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationCreation'
        '201':
          description: Invitation created; token and fragment-only invite_url are returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationCreation'
        '400':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '401':
          $ref: '#/components/responses/WorkspaceSessionRevoked'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/WorkspaceInvalidRequest'
        '429':
          $ref: '#/components/responses/WorkspaceRateLimited'
        '503':
          $ref: '#/components/responses/WorkspaceServiceUnavailable'
  /api/v1/workspaces/{workspace_id}/invitations/{invitation_id}:
    delete:
