name: agentera-app-cloud-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aera_cloud
      POSTGRES_USER: aera_cloud
      POSTGRES_PASSWORD: aera-cloud-dev-only
    ports:
      - "${AERA_CLOUD_POSTGRES_BIND:-127.0.0.1:55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aera_cloud -d aera_cloud"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - aera-cloud-postgres-dev:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      REDISCLI_AUTH: aera-cloud-dev-only
    ports:
      - "${AERA_CLOUD_REDIS_BIND:-127.0.0.1:56381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "aera_cloud", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./config/redis-dev.conf:/usr/local/etc/redis/redis.conf:ro

  encrypted-backup-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: aera-backup-dev
      MINIO_ROOT_PASSWORD: aera-backup-dev-only
    ports:
      - "${AERA_CLOUD_MINIO_BIND:-127.0.0.1:59010}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - aera-cloud-minio-dev:/data
    networks:
      - default
      - encrypted-backup-storage

  encrypted-backup-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      encrypted-backup-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://encrypted-backup-minio:9000
        aera-backup-dev aera-backup-dev-only &&
        mc mb --ignore-existing local/aera-encrypted-backups
    restart: "no"
    networks:
      - encrypted-backup-storage

volumes:
  aera-cloud-postgres-dev:
  aera-cloud-minio-dev:

networks:
  encrypted-backup-storage:
    internal: true
